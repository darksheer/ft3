name: Scheduled Transfer
description: "Scheduled Transfer is a technique employed by malicious actors to systematically move funds out of an account at designated intervals. This tactic is often used in conjunction with financial evasion, laundering, and the cash-out of illicit funds. By setting up or hijacking existing scheduled transfers within financial systems, like those offered by banks or payment processing services, attackers can discreetly channel money to accounts they control or to other entities that help obscure the origins of the funds.\n\nExecution: \n\nCybercriminals may gain control over online banking or payment service accounts — such as those managed by Stripe — and create or modify scheduled transfers to divert funds to other accounts. These scheduled transactions can be programmed to recur at periodic intervals, often lined up with the typical cadence of legitimate business transactions to avoid detection. The funds may be transferred to accounts that further launder the money, such as shell\
  \ companies or cryptocurrency exchanges.\n\nExamples:\n\nA fraudster infiltrates a company's financial system and sets up automated, recurring transfers to external accounts just beneath reporting thresholds to slowly siphon off money without attracting too much attention.\n\nAfter gaining access to a personal banking account, the attacker schedules small transfers to a series of other accounts they control, effectively laundering the money through a web of transactions.\nA compromised business account is used to set up regular payouts to supposed contractors or vendors, in reality, a façade for moving illicit gains.\n\nGoals: The primary objectives behind the Scheduled Transfer technique include:\n\nStealthily extracting funds from a compromised account over an extended period to maximize the total illicit financial gain.\nUtilizing the seeming normalcy of routine, scheduled transfers to blend illicit transactions with legitimate business operations, making them less conspicuous.\nLayering\
  \ the movement of illegally obtained funds as part of the laundering process, aiming to obscure the trail and integrate the money into the legal economy."
