tactics: Financial Evasion, Laundering & Cash-Out
detection: "Employing anomaly detection systems to monitor and flag transactions that don’t match the established behavior of an account, such as new or modified scheduled transfers.\n\nRequiring additional verification for setting up or changing scheduled transfers, especially if the destination account is new or has not previously been associated with regular transactions.\n\nUtilizing alerts that notify account holders of any scheduled transfer well in advance of the actual transaction.\n\nImplementing strict anti-money laundering (AML) controls and reviewing periodic transactions against AML watchlists and patterns.\n\nUse by Fraud Detection and Analysis Teams: \n\nFraud detection teams need to actively monitor for irregularities in scheduled transfers, paying particular attention to new setups, destination accounts, transfer amounts, and frequencies. It’s imperative that teams investigate flagged activities promptly and, if necessary, halt suspicious transfers while further assessment\
  \ is conducted. They should also ensure post-incident recovery efforts are made, including account owner notifications, transaction reversals where possible, and security enhancements to prevent recurrences. Continuous improvement of monitoring strategies is essential to stay ahead of evolving laundering tactics."
