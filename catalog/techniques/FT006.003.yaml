id: FT006.003
stix_id: ''
name: 'Credential Scanning: Telegram'
description: "Adversaries may exploit the Telegram platform—a cloud-based instant messaging service—to search for and extract credentials shared within public or private groups, channels, or via compromised accounts. Telegram groups or channels that are used for professional or corporate communication could inadvertently or through a data leak have sensitive information posted, such as credentials. Additionally, compromised Telegram accounts may also be a source of leaked credentials if these accounts are used for business communication. Execution: Attackers might join public groups or channels within the financial industry to passively collect information over time. Algorithms or bots could be used to monitor conversations for accidental sharing of sensitive information like system credentials. Similarly, adversaries could compromise Telegram accounts belonging to individuals with access to financial information and search through the message history for valuable data. \n\nExamples: Hierarchical\
  \ scraping where bots start with broad financial industry channels and progressively target more specific ones, looking for inadvertent credential sharing.\nData mining message histories of compromised accounts for key terms such as “password,” “login,” “credentials,” “access token,” etc.\nMonitoring conversations in real-time with pattern recognition software designed to detect and alert when credential formats are posted. \n\nGoals: The aim of an attacker performing credential scanning on Telegram is to gain unauthorized access to financial systems, customer accounts, or internal networks. With valid credentials, an adversary could conduct transactions, access sensitive customer information, exfiltrate financial data, or further penetrate internal systems for espionage or sabotage."
