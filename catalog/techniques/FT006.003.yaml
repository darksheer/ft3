tactics: Reconnaissance
detection: |-
  Implementing strict usage policies for communication platforms to prevent the sharing of sensitive information.
  Training and awareness programs to educate employees on the risks of sharing credentials over messaging platforms.

  Regularly monitoring channels and group communications for security-related issues.
  Utilizing data loss prevention (DLP) and monitoring tools that can flag sensitive data being shared.
  Incident response planning to swiftly react to reports of leaked credentials.

  Encouraging the use of secure credential sharing mechanisms, like managed password systems.
  Use by Fraud Detection and Analysis Teams: Fraud detection and analysis teams should implement surveillance mechanisms that could highlight indicators of compromise within Telegram communications. This may involve the use of specialized software to detect sensitive information patterns within Telegram messages. In the event of detected leaks, immediate actions such as credential resetting, account suspension, and further investigation can be taken to minimize potential damages. Additionally, recoverability protocols should be in place to reclaim compromised Telegram accounts and limit the risk of recurring information leakage.
