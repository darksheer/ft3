tactics: Initial Access
detection: "Stripe and businesses should monitor for unauthorized access signals such as logins from new devices or IP addresses, changes in account settings, and abnormal transaction patterns.\n\nImplementing and enforcing two-factor authentication (2FA) to provide an additional layer of security beyond passwords.\n\nEducating users about secure practices, including identifying phishing scams and the importance of not reusing passwords across multiple services.\n\nUtilizing advanced threat detection systems that monitor for signs of credential stuffing and other automated takeover attempts.\n\nRegularly reviewing transaction and refund patterns for anomalies that might indicate fraudulent activity.\n\nUse by Fraud Detection and Analysis Teams: \n\nFraud detection teams must monitor for unusual account activities, such as spikes in transaction volumes, change in bank account details, or modifications to payout schedules. If a takeover is suspected or detected, immediate action should be\
  \ taken to secure the account, including locking the account, forcing a password reset, and auditing recent transactions for fraud. Teams should also conduct forensic analysis to understand how the breach occurred and implement additional security measures to prevent future occurrences. Strong collaboration between Stripe, affected businesses, and financial institutions is essential to quickly respond to incidents, trace the source of the fraud, and implement strategies to prevent recurrences."
