name: Account Takeover
description: "An account takeover (ATO) refers to the unauthorized access and control of a user account on a financial platform, typically belonging to a merchant or business. Such platforms are commonly used by online businesses to manage transactions, subscriptions, and payment-related services. Gaining access to an account allows attackers to divert funds, access sensitive customer financial data, and compromise the integrity of the victim's financial operations.; Execution: Methods used for account takeover can include: \n\nPhishing Attacks: Targeting users with emails that appear legitimate to steal login credentials.; Exploiting Vulnerabilities: Taking advantage of weaknesses in applications or platforms.; Credential Stuffing: Using previously leaked usernames and passwords to gain access.; Social Engineering: Manipulating individuals into revealing confidential information.; Malware: Employing malicious software, such as keyloggers, to capture keystrokes. Once attackers gain access,\
  \ they can change account details, reroute payments, initiate refunds, or extract data for further fraudulent activities.; Examples: Sending targeted phishing emails impersonating a legitimate financial platform to capture user credentials.; Utilizing known compromised credentials to gain access to accounts with reused passwords.; Intercepting two-factor authentication codes through methods such as SIM swapping to bypass security measures.; Goals: Objectives behind an account takeover include: Directly stealing funds from the compromised account or intercepting transactions intended for legitimate business.; Accessing and potentially selling sensitive customer data, including credit card information and transaction histories.; Using the compromised account to conduct broader financial fraud and scams.\n"
