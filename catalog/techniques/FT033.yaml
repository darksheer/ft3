name: No Shipping
description: "The \"No Shipping\" technique in the context of online fraud refers to scenarios where fraudsters manipulate e-commerce transactions to bypass the requirement for a shipping address, often in digital goods purchases or when using stolen credit card information. Since shipping addresses can be used to verify the purchaser’s identity and physical location, avoiding the need to provide a legitimate address can reduce the risk of detection and increase the success of fraudulent transactions.\n\nExecution: \n\nAttackers target online storefronts that do not mandate a shipping address for certain types of purchases, particularly for digital products or services such as gift cards, software licenses, subscriptions, or other downloadable content. When using stolen credit card information, fraudsters prefer these types of transactions as they receive the goods directly and anonymously without the need for delivery to a physical location.\n\nExamples:\n\nA fraudster purchases online\
  \ gift cards or digital content using stolen credit card details, where the items are delivered via email or directly accessible through an online account, with no physical shipping required.\nAn attacker exploits a website's checkout process that allows opting out of shipping details for certain products, even though a physical product might be involved, to avoid creating a delivery address trail that could be traced.\nManipulating e-commerce platforms that have insufficient checks for digital purchases, allowing the immediate issuance of redeemable assets without confirming the authenticity of the purchaser’s details.\n\nGoals: The primary goal for a cybercriminal using the \"No Shipping\" technique is to:\n\nEvade additional validation checks that may come with providing a physical shipping address, thus reducing the risk of being caught.\nQuickly realize the value from stolen credit card information by immediately obtaining usable goods or services that can be resold or converted to\
  \ cash.\nPrevent linking back to their physical location, which can be important for maintaining anonymity and avoiding law enforcement pursuit.\n"
