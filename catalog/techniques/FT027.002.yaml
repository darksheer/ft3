tactics: Discovery & Profiling
detection: "Implementing role-based access controls to ensure that only authorized personnel can view or change account tier information.\n\nMonitoring for abnormal activities or API calls that seek to reveal service level details or test the limits of account privileges.\n\nApplying strict anomaly detection rules that alert on changes to account configurations or feature toggles indicative of tier enumeration.\n\nSecuring API keys and maintaining detailed logs of API usage to detect and investigate unauthorized attempts to determine account tier.\n\nRegularly assessing the security posture of the account and ensuring that all users with access are aware of the indicators of reconnaissance activities.\n\nUse by Fraud Detection and Analysis Teams: \n\nStripe’s fraud detection teams should be equipped with tools to detect unusual patterns in how accounts are accessed, focusing on signs that someone is attempting to gather information on the account’s capabilities or service tier. Behavioral\
  \ analytics can help flag when an account is accessed in a manner inconsistent with the user’s normal activity, such as navigating through subscription or plan details or making unexpected API requests. If suspicious behavior is detected, they should initiate prompt security measures, potentially including account audits, re-validating user identities, or even temporarily locking the account to prevent misuse. These teams should also cooperate with Stripe's customer support and account management teams to promptly address any identified issues and to reinforce the account's security."
