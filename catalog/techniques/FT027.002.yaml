id: FT027.002
stix_id: ''
name: 'Account Enumeration: Account Tier Enumeration'
description: "Account Tier Enumeration for Stripe involves an attacker determining the level of service and feature set that a compromised Stripe account has access to. This type of reconnaissance is aimed at understanding the tier or subscription level, as different tiers may have varying processing capabilities, transaction limits, access to premium features, and API access scopes.\n\nExecution: \n\nOnce an adversary has gained access to a Stripe account, they will explore the account details page, subscription settings, and other relevant sections to ascertain the account’s tier. Attackers may also make API calls that reveal the scope of services enabled for the account, such as advanced fraud protection features, custom reporting, or higher rate limits that come with premium tiers.\n\nExamples:\n\nReviewing account settings to identify mentions of the account plan or subscription level, such as ‘Standard’, ‘Pro’, or ‘Enterprise’.\nQuerying the Stripe API for available features or rate-limit\
  \ information that might only be accessible to higher-tier accounts.\nAttempting to enable features or make configurations changes that are tier-dependent to infer the current service level by the success or failure of these changes.\n\nGoals: The primary objectives for an attacker involved in account tier enumeration may include:\n\nIdentifying premium accounts that could present higher-value targets due to a larger volume of transactions or higher credit limits.\nExploiting advanced features that may be misconfigured or less likely to be monitored by organizations assuming they are secure.\nAssessing the extent of potential fraud activities that can be conducted without tripping automated fraud detection systems, which may be more or less stringent based on tier."
