id: FT011.002
stix_id: ''
name: 'Account Takeover: Exposed Login Credential'
description: |
  Account Takeover (ATO) via Exposed Login Credentials Overview: In financial cyber fraud, account takeover (ATO) involving exposed login credentials refers to unauthorized access and manipulation of a user account using known or leaked username and password combinations. Unauthorized access to payment processing accounts can result in severe repercussions, including financial loss and data breaches.; Execution: Attackers obtain login credentials through various methods: Data Breaches: Login details may be leaked from compromised databases.; Phishing Campaigns: Users are tricked into revealing their usernames and passwords.; Malware: Keyloggers capture keystrokes to obtain credentials.; Password Spraying: Attackers attempt common passwords in hopes of a match. Once access is gained, adversaries can modify payment routing details, initiate refunds, and access sensitive financial data. Examples: Using a list from a data breach containing email and password pairs in a credential-stuffing attack to access accounts.; Sending phishing emails that appear as security alerts to trick employees into entering login details on a fraudulent website.; Discovering login credentials through social media or public information and using them to access accounts.; Goals: Typical goals for attackers executing an account takeover with exposed login credentials include: Withdrawing funds from the compromised account or redirecting payouts.; Accessing sensitive customer data for identity theft or further phishing attacks, or selling on the dark market.; Altering invoice or billing configurations to redirect future payments.; Using the compromised account as a base for launching additional fraud schemes.
