name: Seaching Credential Dumps
description: "Attackers often search for compromised data dumps, which are large collections of stolen credentials leaked from previous breaches or hacking incidents. When targeting platforms, fraudsters look for relevant login credentials or associated emails and passwords that might provide access to accounts or aid in bypassing two-factor authentication.\n\nExecution: \n\nAttackers obtain credential dumps from dark web marketplaces, hacking forums, or through their own network breaches. Using automated tools, they sift through these dumps to find username and password pairs. They might also search for email addresses and associated passwords to target users with enabled two-factor authentication, hoping those individuals reuse passwords across multiple services.\n\nExamples:\n\nFinding a list of email and password pairs in a data breach dump, then using those credentials to attempt logins into accounts.\nUtilizing stolen email access to intercept two-factor authentication codes or password\
  \ reset emails.\nCompiling lists of account credentials from various sources and trying them en masse, exploiting users' tendencies to reuse passwords across different platforms.\n\nGoals: The primary aims of searching credential dumps for fraudulent purposes include:\n\nUnauthorized access to accounts for fraudulent transactions, financial theft, or gathering sensitive customer and business data.\nOvercoming two-factor authentication by obtaining access to the email accounts tied to accounts.\nCreating a foundation for more sophisticated attacks, such as business email compromise (BEC), using trusted communication channels gained from compromised accounts or emails.\n"
