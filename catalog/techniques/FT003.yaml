tactics: Reconnaissance
detection: "Regularly monitoring known sites for data dumps and using services that alert when company or user credentials are found in breach databases.\n\nEnforcing strong, unique password policies for Stripe accounts and pairing them with more advanced two-factor authentication methods that are not solely reliant on email.\n\nEducating users about the dangers of password reuse and the importance of changing passwords following news of relevant data breaches.\n\nUtilizing automated threat detection systems that alert when an unknown IP or device attempts to access a Stripe account.\n\nUse by Fraud Detection and Analysis Teams: \n\nFraud detection teams should employ tools to scour the internet for leaked credential dumps and analyze them for potential risks to Stripe accounts. Security measures like frequent password rotations, enhanced user verification during account recovery, and anomaly detection algorithms for login patterns should be implemented. Account monitoring should also focus\
  \ on the successful logins following failed attempts, as this is often a sign of credential stuffing attacks. If compromised credentials are detected, immediate action is needed to secure the affected accounts, which may include forced password resets and additional verification steps to confirm the account holder's identity. Post-incident, the team should reassess and strengthen account security to mitigate the risk of future breaches."
