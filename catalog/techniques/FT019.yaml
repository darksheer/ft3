tactics: Defense Evasion & Obfuscation
detection: "Employing anti-phishing tools and services that actively scan for website clones and alert organizations when potential fraud is detected.\n\nImplementing SSL certificates and ensuring that users know to check for ‘https’ in the URL as a sign of a secure site.\n\nEducating users about the dangers of clicking on unsolicited links and the importance of verifying a website’s URL before entering sensitive information.\n\nMonitoring domain registrations for names similar to the organization’s to catch potential typosquatting attempts early.\n\nUse by Fraud Detection and Analysis Teams: \n\nFraud detection and analysis teams should use various cybersecurity tools and strategies to identify potential website clones. This could include proactive crawling of the web for duplicate content or domain names, utilizing browser blacklists that warn users about suspicious websites, and leveraging web analytics to identify unusual traffic patterns indicative of a clone. When a cloned site is\
  \ detected, steps must be taken to shut it down, often involving coordination with domain registrars and hosting providers, as well as legal action. Public communication may also be necessary to prevent customers from falling victim to the site and to ensure that there is awareness of the fraudulent activity."
