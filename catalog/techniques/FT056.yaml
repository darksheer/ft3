name: 3DS Bypass
description: 3DS (Three-Domain Secure) bypass is a fraudulent technique where attackers exploit weaknesses in the 3DS authentication protocol to circumvent additional layers of security typically required for online credit card transactions. By deliberately providing incomplete or insufficient information—such as using a single letter for the cardholder’s name—the attackers cause the 3DS authentication to fail open. This means that the transaction is processed without the additional security checks, allowing the fraudsters to complete purchases without triggering fraud detection systems. This method undermines the purpose of 3DS, which is designed to protect online transactions from unauthorized use.
