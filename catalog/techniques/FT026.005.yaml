tactics: Defense Evasion & Obfuscation
detection: "Employing advanced document authentication technologies to examine and verify the authenticity of all submitted business documentation, paying close attention to details such as fonts, layouts, and official language.\n\nCross-referencing EIN details through direct communication with the IRS, where legally permissible, or verifying through publicly accessible business databases.\n\nConducting in-depth reviews for any inconsistencies or discrepancies in the application or accompanying documents.\n\nRequiring additional proof of business operations, such as utility bills, lease agreements, or bank statements, in case of doubt regarding the validity of business documents.\n\nUse by Fraud Detection and Analysis Teams: \nFraud detection teams at Stripe should develop protocols tailored to identify manipulated or fake SS-4 confirmation letters. Utilizing a combination of digital forensic techniques that can flag any potential tampering with documents and manual verification by trained\
  \ specialists will reduce the likelihood of such forgeries slipping through the KYC process. If fraudulent activity is suspected, teams must act promptly to freeze the verification or onboarding process and investigate the veracity of the submitted documents. Working alongside legal teams and authorities may also be necessary to address and curtail such fraudulent activities effectively."
