name: Credential Scanning
description: "Credential scanning involves methodically searching through online systems and services to locate exposed or insecurely stored credentials, like API keys. Attackers use various automated tools to scan source code repositories, environment configuration files, and other web-accessible resources for accidentally exposed credentials that can be used for fraudulent activities or unauthorized account access.\n\nExecution: \n\nThe process typically uses botnets or scripts that probe public code repositories (e.g., GitHub or GitLab), public data storage (e.g., Amazon S3 buckets), and other websites where developers might inadvertently leave sensitive information. The search includes pattern matching techniques to identify strings that correspond to access tokens, secret keys, or embedding API keys in code snippets. When successful, fraudsters can use these credentials to gain access to accounts, make unauthorized transactions, access customer data, or execute operations afforded by\
  \ the API for malicious purposes.\n\nExamples:\n\nUtilizing search engines and specialized tools to find and index websites with .env files or directories that are not secured and potentially contain API keys.\nScanning GitHub repositories for commits containing secret keys using pattern recognition, which could indicate, for instance, a string starting with 'sk_live_' followed by a series of alphanumeric characters.\nSearching question-and-answer sites, developer forums, or documentation sites where developers may have unknowingly shared code containing live API keys.\n\nGoals: The primary aim of conducting credential scanning for API keys is to:\n\nAcquire valid API keys that provide direct access to account features, allowing the execution of fraudulent transactions, data theft, or account manipulation.\nUse found credentials for financial gains by committing fraud, selling compromised account access, or launching further attacks against linked third-party systems.\nScan for and aggregate\
  \ a large quantity of credentials, searching for those that may provide particularly lucrative or high-privileged access."
