tactics: Reconnaissance
detection: "Routinely reviewing and rotating Stripe API keys, especially when transitioning from development environments to production.\n\nImplementing strict access controls and proper secret management practices, ensuring sensitive credentials are never hardcoded into version-controlled source code.\n\nEmploying automated tools that scan for and alert on accidental credential exposures across public code repositories and online storage platforms.\n\nConfiguring web servers to block public access to sensitive files and directories, like .env files, which often store API keys and other secrets.\n\nOffering security training to developers to raise awareness about safe secret handling and the dangers posed by credential leakage.\n\nUse by Fraud Detection and Analysis Teams: \n\nFraud detection teams should use scanning tools and manual audits to continuously monitor for exposed credentials related to the services their systems interact with. Automated alerts should be set up to flag potential\
  \ exposures, and prompt investigation should be conducted when warnings occur. In the event of exposure detection, it is crucial to revoke the compromised keys and take steps to secure the affected areas. Teams must also engage in proactive outreach to the development community, informing them about best practices for using and storing Stripe API keys and reacting swiftly to reported exposures. Post-exposure actions include working with the impacted users to secure their accounts, assess any resulting damages, and shore up defenses to prevent similar incidents.\n\n"
