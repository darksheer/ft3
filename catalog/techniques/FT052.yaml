name: Falsifying Identity Documents
description: "Falsifying Identity Documents is a technique used by cybercriminals and fraudsters to create or alter identification documents in order to impersonate legitimate individuals or entities. This method is part of a broader tactic to evade defenses and obfuscate their true identities, enabling attackers to bypass security measures, open fraudulent accounts, or gain unauthorized access to financial systems and services.\n\nProcedure:\n\nGathering Information: Attackers start by collecting personal information from various sources. This could include data breaches, phishing attacks, social engineering, or purchasing stolen data from underground markets. The information typically includes names, addresses, social security numbers, and other sensitive data required to create convincing identity documents.\n\nCreating Fake Documents: Using high-quality advanced software tools (AI, Photoshop, etc.), criminals fabricate fake identity documents such as driver’s licenses, passports, social\
  \ security cards, utility bills, and bank statements. These documents often contain forged personal information and counterfeit security features designed to withstand scrutiny.\n\nAltering Existing Documents: Instead of creating documents from scratch, some attackers modify genuine documents. They may alter names, dates, or other fields on existing IDs to match the stolen or assumed identity. This method can be harder to detect since the altered documents retain some of the original security features.\n\nUsing Fake or Altered Documents: Once the falsified or altered documents are ready, attackers use them to:\n\nOpen bank accounts, credit lines, or merchant accounts.\nGain employment or access to restricted areas.\nVerify identities for online services and applications.\nConduct financial transactions or withdraw money.\nMitigating Risks and Passing Verification: To further evade detection, attackers might use these documents in conjunction with other evasion techniques such as spoofed\
  \ phone numbers, fake addresses, and synthetic identities. They may also leverage digital tools to alter metadata and bypass online verification systems. \n\nMitigation Strategies:\n\nOrganizations and individuals can adopt various strategies to mitigate the risks associated with falsified identity documents:\n\nEnhanced Verification Processes: Implement multi-factor and out-of-band verification methods that require more than just identity documents, such as biometrics, knowledge-based authentication, or live identity verification interviews.\n\nDocument Scanning Technology: Utilize advanced document scanning and validation technologies that can detect anomalies, inconsistencies, or counterfeit security features in identity documents.\n\nCross-Referencing Data: Cross-verify information using trusted third-party databases and official government sources to ensure the legitimacy of the provided documents and details.\n\nBehavioral Analytics: Monitor and analyze user behavior for signs of\
  \ suspicious activity that could indicate the use of falsified documents, such as unusual login patterns, rapid account application attempts, or mismatches in provided information.\n\nEmployee Training: Train personnel to recognize signs of counterfeit documents and to follow robust verification protocols when processing identity documentation."
