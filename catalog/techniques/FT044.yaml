name: Scheduled Payout
description: "The 'Scheduled Payout' technique involves the manipulation or exploitation of the timing and allocation of funds within financial management systems, specifically in services like Stripe that provide programmable payout schedules to merchants. In the context of financial evasion, laundering, and cash-out, malefactors might alter these schedules to obscure the source or destination of funds, to delay the detection of illicit activities, or to integrate illegal proceeds into the legitimate financial system.\n\nExecution: \n\nCybercriminals with access to, or control over, merchant accounts may adjust the scheduled payout dates, amounts, and destination accounts to facilitate their financial crimes. This can include accelerating the pace of payouts to quickly move ill-gotten gains out of the immediate reach of law enforcement, diversifying the endpoints of these payouts to complicate any money trail, or delaying the transfer of funds to a time perceived as having reduced scrutiny.\n\
  \nExamples:\n\nAdjusting the payout schedule of a compromised merchant account to immediately cash out following a fraudulent spike in transactions.\nDiscretely spreading large sums of money across multiple payout schedules and accounts to avoid triggering financial watchdogs.\nStrategically setting payout times post-fraudulent activity to coincide with high-volume periods, using the noise to hide illicit transactions.\n\nGoals: The overarching goals associated with maliciously manipulating 'Scheduled Payouts' are to:\n\nExpedite the flow of laundered money from recently compromised accounts before fraud detection systems can flag the activities.\nStraddle the movement of illicit funds across different time frames to blend in with normal payment activities and reduce the likelihood of detection.\nUtilize legitimate financial infrastructures to accumulate and disperse criminal proceeds, thus laundering the money."
