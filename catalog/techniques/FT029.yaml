tactics: Lateral Movement & Internal Proliferation
detection: "Auditing all accounts with cross account permissions regularly to ensure their actions are legitimate and align with their intended use cases.\n\nImplementing strict least-privilege access controls and avoiding unnecessary grants of comprehensive rights across accounts.\n\nContinuously monitoring for unusual patterns of transactions, access, or changes in configurations that might indicate unauthorized use of permissions.\n\nRequiring multi-factor authentication and frequent password changes for accounts with significant cross account permissions.\nEncouraging users to employ role-based access and to monitor the activity logs of external parties granted access to their Stripe accounts.\n\nUse by Fraud Detection and Analysis Teams: \n\nFraud detection teams focusing on systems like Stripe should vigilantly track the usage of cross account permissions and anomalies associated with such activities. Using advanced security and analytics tools, they should screen for atypical behavior\
  \ that deviates from the typical access patterns or operational profiles for accounts with interconnected permissions. Immediate action, including temporary suspension of suspicious activities and rigorous verification processes, is paramount upon signs of unauthorized use. Ensuring constant communication between related accounts, in the form of alerts when permissions are used or accounts accessed, can further help prevent exploitation. In cases where unauthorized activity is verified, revoking permissions and working closely with affected parties to investigate and recover from the incident are critical."
