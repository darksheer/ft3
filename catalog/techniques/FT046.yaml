tactics: Impact & Disruption
detection: "Deploying anti-DoS tools and services designed to identify and filter out the malicious traffic that characterizes such assaults.\n\nStrengthening network architecture with redundant systems and pathways that can re-route traffic during an attack to maintain service availability.\n\nUtilizing rate limiting, load balancing, and web application firewalls (WAFs) to differentiate and manage legitimate user traffic from attack traffic.\n\nEstablishing comprehensive incident response protocols to ensure quick and effective action can be taken to combat an active attack.\n\nConducting regular stress tests and vulnerability assessments on Stripe's systems to identify and address potential weak points.\n\nUse by Fraud Detection and Analysis Teams: \n\nFraud detection teams must monitor network traffic for abnormalities that could signal an impending or ongoing DoS attack. This involves setting up system alerts for unusually high traffic levels or repetitive access requests. In the event\
  \ of an attack, swift incident response measures are critical — these include engaging DoS mitigation services and isolating the affected systems to minimize disruption. After mitigating the attack, conducting thorough investigations into the attack vectors used, patching vulnerabilities, and reinforcing defenses against future attacks is essential. Communication with law enforcement might also be warranted, as DoS attacks can be illegal and part of a broader criminal strategy."
