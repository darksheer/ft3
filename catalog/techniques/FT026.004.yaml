tactics: Defense Evasion & Obfuscation
detection: "Implementing verification protocols that include direct validation of EINs with IRS databases or utilizing third-party verification services that have lawful access to such information.\n\nTraining KYC analysts to recognize signs of document tampering and to be familiar with the standard IRS letter formatting and content.\n\nUtilizing document verification technology capable of examining metadata and other indicators of document authenticity that human eyes might miss.\n\nExecuting cross-checks with other government or state-provided business verification databases to corroborate the validity of the EIN and corresponding business information.\n\nUse by Fraud Detection and Analysis Teams: \n\nFraud detection teams at Stripe must maintain a comprehensive validation system to detect fake IRS Letter 147C documents. Automated validation should be supplemented with manual checks, particularly for details that may appear out of the ordinary or for businesses that raise additional red\
  \ flags during the onboarding process. In the event of identifying a counterfeit IRS Letter 147C, immediate measures should be taken, including suspension of the verification process, close scrutiny of the submitted documents, and, if necessary, engagement with law enforcement to prosecute the perpetrators. Additionally, sharing intelligence on emerging falsification patterns can help enhance collective defenses against such tactics."
