id: FT011.003
stix_id: ''
name: 'Account Takeover: Exposed User Session/Token'
description: |
  Account takeover (ATO) via an exposed user session or token targets authentication tokens or session cookies that maintain a user's logged-in state. When these tokens are compromised, typically through malware or man-in-the-middle (MitM) attacks, cybercriminals can hijack them. This allows attackers to impersonate legitimate users and gain unauthorized access to financial accounts without needing the user's credentials.; Execution: Banking malware or trojans can infiltrate a user's device and capture session tokens during an active session by logging keystrokes, capturing network traffic, or scraping browser session data. Once stolen, these tokens can be sent to a command and control (C2) server for attackers to access the affected account. This sensitive information may traverse insecure channels or be improperly stored, making it vulnerable to interception and misuse. Examples: Using banking trojans like Emotet or TrickBot to steal browser session cookies and tokens.; Exploiting cross-site scripting (XSS) vulnerabilities to capture session tokens.; Conducting man-in-the-middle attacks to intercept network traffic and capture unencrypted session tokens from users accessing accounts without a secure connection.; Goals: The objectives of stealing and using exposed user session tokens include: Performing unauthorized financial transactions, including fund transfers.; Altering account settings and payment routing details to misappropriate future payments.; Accessing sensitive billing and customer information for use in further fraud or sale to criminals.; Leveraging the account to set up fake merchant pages or services, perpetuating additional scams and misinformation.
