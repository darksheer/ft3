id: FT011.001
stix_id: ''
name: 'Account Takeover: Exposed Credential'
description: |
  Account Takeover (ATO) via Exposed API Key Overview: Account takeover (ATO) via an exposed API key refers to unauthorized actors gaining access to a user account by acquiring the API key, which is intended to control account functions programmatically. An API key acts as a secret token that permits interaction with financial services on behalf of the account holder. Exposure of this key can lead to unauthorized account access, manipulation of payment flows, theft of sensitive data, and illicit transactions.; Execution: Exposure of an API key can occur through various means, such as: Improperly Secured Code Repositories: Code containing API keys may be inadvertently uploaded to public repositories.; Unsecured Files: API keys stored in plain text on web servers or within applications.; Shared Code: Developers sharing code snippets in forums without realizing they contain sensitive information.; Phishing Attacks: Targeting developers or employees in organizations to retrieve API keys. Examples: An employee mistakenly uploads code with an API key to a public repository.; A developer shares code for troubleshooting purposes, unknowingly including an API key.; A hacker gains access to a network and discovers an API key stored in plain text within configuration files.; Goals: Attackers exploit an exposed API key for objectives such as: Accessing and exfiltrating transaction records and customer payment information.; Creating fraudulent transactions or refunds to siphon funds into their own accounts.; Altering payment configurations to reroute future payments.; Using obtained data for further targeted phishing campaigns or financial fraud against customers.
