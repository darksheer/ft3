tactics: Initial Access
detection: "Ensuring that API keys are never hard-coded in publicly accessible applications, checked into version control systems, or shared in an insecure manner.\n\nUtilizing secret management tools and environments variables for storing and accessing sensitive credentials.\n\nConducting periodic audits of data storage and environmental configurations to safeguard API keys.\n\nImplementing monitoring tools that can detect and alert on exposed credentials or unusual activity from API usage.\n\nRegenerating API keys whenever there is a suspicion of exposure, following best practices for rotation and invalidation of old keys.\n\nUse by Fraud Detection and Analysis Teams: \n\nFraud detection teams should set up real-time monitoring for any irregular activities that suggest an exposed Stripe API key might be exploited, such as listening for unusual patterns of API calls or unforeseen changes in transaction volumes. If abnormal activity is detected, a rapid response protocol should be enacted,\
  \ including revocation of the compromised API key, securing potentially impacted accounts, and investigating the scope of the exposure. Additionally, teams should analyse the origins and potential impacts of the key's exposure to strengthen preventive measures and close any security gaps that were exploited. They should also communicate with Stripe's security team to share information and, if necessary, coordinate a response to the incident."
