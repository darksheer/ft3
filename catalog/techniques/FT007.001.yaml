name: 'Acquire Access: Botnet'
description: "In the financial fraud domain, adversaries may acquire access to a botnet to carry out automated attacks on a large scale. Botnets are networks of compromised computers (bots) that can be remotely controlled by an attacker. Acquiring access to a botnet allows attackers to perform various malicious activities, such as launching Distributed Denial-of-Service (DDoS) attacks against financial institutions, executing credential stuffing campaigns, or spreading malware to commit financial fraud.\n\nExecution: Adversaries can either create their own botnets by spreading malware that infects devices and adds them to the network, or they can acquire access to existing botnets on the dark web. These botnets can then be leveraged to target financial entities with the aim of stealing credentials, causing service disruptions, or generating fraudulent transactions.\n\nExamples:\n\nInfecting user devices with malware through phishing campaigns or drive-by downloads to grow a botnet.\nRenting\
  \ or purchasing access to pre-existing botnets from underground marketplaces.\nUsing botnets to perform credential stuffing attacks against online banking or payment platforms by attempting to authenticate with stolen or leaked username and password pairs.\n\nGoals: \n\nThe ultimate goal for attackers using botnets in financial cyber fraud is to maximize the impact of their attacks, given the automated and distributed nature of botnet capabilities. They may seek to hijack online accounts, execute unauthorized transactions, disrupt financial services, or perform reconnaissance for more targeted attacks, while simultaneously hiding their true location and identity."
