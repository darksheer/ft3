tactics: Collection & Exfiltration
detection: "Monitoring and alerting on atypical access to billing analytics data and unusual export activity within the Stripe Dashboard.\n\nEnforcing role-based access controls (RBAC) to ensure that only authorized users within the organization have permission to access and export billing analytics data.\n\nRegular auditing of user actions in the dashboard, especially concerning the generation and downloading of reports or data sets.\n\nEmploying encryption for stored data and secure transmission channels to protect data during and after export.\n\nTraining staff on the sensitive nature of financial data and the risks associated with improper access or handling.\n\nUse by Fraud Detection and Analysis Teams: \n\nFraud detection teams should be alert to abnormalities in the access or export of billing analytics data, which could signal unauthorized exfiltration. Use of behavior analytics to spot sudden changes in data access patterns or exporting outside of business hours can be indicative\
  \ of malicious activity. Immediate investigation and response actions should follow any anomaly detections, including analyzing access logs, conducting user interviews, and potentially resetting credentials if a compromise is detected. Following an incident, a deeper security review is necessary to solidify defenses and prevent similar exfiltration in the future, and it may involve modifying internal policies, enhancing security training, and improving technical safeguards."
