name: Social Media Attack
description: "Social media attacks are a broad category of malicious activities carried out on platforms like Facebook, Twitter, LinkedIn, Instagram, and more. These attacks aim to trick victims into disclosing sensitive information, such as passwords and financial data, or to distribute harmful content including fraudulent links, phishing attempts, or malware. Social media users are often targeted for their personal information, which can be used in various forms of identity theft, financial fraud, or to gain unauthorized access to secure systems.\n\nExecution: \n\nFraudsters can execute social media attacks using fake profiles, compromised accounts, or pages created to mimic real organizations. Tactics include spearphishing, where specific individuals are targeted with personalized messages, baiting users by offering fake freebies or exclusive content, and pretexting, which involves creating a fabricated scenario or story to obtain private information.\n\nExamples:\n\nSending direct messages\
  \ from a hacked account to the victim’s contacts, urging them to click on malicious links under the guise of legitimate requests or offers.\nCreating fake profiles or pages that appear to belong to well-known companies or brands, advertising non-existent deals or discounts that lead to phishing sites.\nSpread of deceptive posts or tweets encouraging users to visit fraudulent websites designed to steal login credentials or install malware.\nLeveraging trending topics or events to distribute manipulated content or links that redirect to fraudulent sites.\n\nGoals: Cybercriminals use social media attacks to achieve goals including:\n\nStealing user credentials in order to access financial accounts or perpetrate identity theft.\nCompiling personal details harvested from social media interactions for social engineering schemes.\nDistributing malware that can hijack personal computers for further malicious activities, such as ransomware attacks or unauthorized cryptocurrency mining.\nDamaging\
  \ reputations or causing embarrassment by taking over social media accounts and posting inappropriate or malicious content."
