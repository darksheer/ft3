tactics: Resource Development
detection: "Monitoring organizational networks for access to known Telegram API endpoints, which could indicate unauthorized use of the platform within a business environment.\n\nImplementing policies and training for employees to recognize and report the unauthorized use of messaging platforms for business communications.\n\nUtilizing cybersecurity solutions capable of detecting and flagging the installation of unauthorized apps, such as Telegram, on corporate devices.\n\nUse by Fraud Detection and Analysis Teams: \n\nFraud detection and analysis teams should be vigilant in looking for signs of Telegram being used within the business environment for unauthorized purposes. This includes the use of network monitoring tools to detect connections to Telegram services that deviate from normal communication patterns. Teams must also work to understand the role such platforms play in the broader context of cybercrime and continually update their defense strategies to mitigate the risk posed by\
  \ secure messaging apps used for illicit activities. In the case of discovered misuse, swift action is required to investigate the extent and purpose of the accounts and coordinate with the messaging platform for possible account suspension and further action."
