name: Shell Companies
description: "The use of shell companies in relation to Stripe involves the creation of businesses in name only, without actual operations, to abuse the financial system. These entities are set up by fraudsters to appear legitimate, with the primary purpose of facilitating fake transactions on payment platforms like Stripe. Such activities can be used to deceive financial institutions, manipulate financial statements, or launder ill-gotten gains.\n\nExecution: \n\nTo execute this form of fraud, perpetrators first set up shell companies, often including forged or minimal business documents, and then register these entities with Stripe as merchants. The faux companies may start processing fabricated transactions to feign legitimate business activity. In money laundering schemes, they might use the shell company accounts on Stripe to process seemingly legitimate transactions, moving and layering the illicit funds to make them appear clean.\n\nExamples:\n\nCreating a network of shell companies\
  \ that purport to offer digital products or services and using these Stripe accounts to issue and accept payments between each other to create a false trail of legitimate transactions.\nUsing fake supplier accounts to issue invoices and process payments for goods or services never rendered, thus funneling company profits into accounts controlled by the fraudsters.\nEngaging in 'transaction laundering', where a shell company's Stripe account processes credit card transactions for another business that may be engaged in illegal or prohibited activities, making it look like a legitimate sale.\n\nGoals: The goals behind the use of shell companies on Stripe include:\n\nLaundering money by masking the transfer of funds as bona fide transactions processed through Stripe’s payment system.\nCamouflaging fraudulent financial activities, such as siphoning funds from legitimate businesses or engaging in tax evasion schemes.\nGenerating fabricated revenue streams and financial records to inflate a\
  \ company's valuation or manipulate its financial statements."
