tactics: Discovery & Profiling
detection: "Maintaining strict controls over who can view or modify Radar settings, possibly using features like two-factor authentication for sensitive areas of the Stripe dashboard.\n\nImplementing alerting mechanisms that notify administrators of unusual activity within the Radar rule settings or multiple near-miss transactions that could indicate testing of the fraud detection system.\n\nUsing machine learning-based fraud detection in parallel with Radar rules to detect and respond to atypical patterns that might not be caught by static rule sets.\n\nRegularly reviewing and updating Radar rules to adapt to new fraud trends and to counter attempts at gaming the system.\nTraining staff on the importance of operational security to prevent sensitive information about fraud detection practices from being disclosed inadvertently.\n\nUse by Fraud Detection and Analysis Teams: \n\nFraud detection and analysis teams at Stripe should actively monitor transaction logs, rule hits, and user activity\
  \ concerning Radar rules. By deploying analytical tools that detect potential enumeration attempts, such as probing transactions that do not culminate in a fraud block but consistently test the rule boundaries, teams can rapidly investigate and respond to potential threats. In the case of detected Radar rule enumeration, immediate actions such as resetting user sessions, revoking API keys, and conducting thorough security audits of the Radar configurations should be taken. It's also essential for these teams to collaborate with Stripe's security department to understand the full scope of the issue and to implement additional measures to protect against future enumeration attempts."
