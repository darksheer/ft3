id: FT027.003
stix_id: ''
name: 'Account Enumeration: Account Radar Rule Enumeration'
description: "Account Radar Rule Enumeration is a specific form of reconnaissance where an attacker, after gaining unauthorized access to a Stripe account, attempts to determine the custom fraud detection rules that have been set up using Stripe Radar. Stripe Radar is a suite of tools designed to help businesses detect and prevent fraud in real-time. By understanding the configured rules, an attacker can tailor fraudulent activities to fly under the radar, avoiding triggers that would otherwise block transactions or flag them for review.\n\nExecution: \n\nTo perform this type of enumeration, savvy attackers would navigate the Stripe dashboard Radar settings if they have UI access or make authenticated calls to the Stripe API to list Radar rules. They may methodically test the fraud detection system by initiating transactions that barely skirt the thresholds of existing rules or otherwise observe the transaction review logs to deduce which activities are being flagged or blocked.\n\nExamples:\n\
  \nAnalyzing the list of active Radar rules found within the Stripe dashboard to understand what behaviors or transaction characteristics are being monitored.\nMaking controlled, incremental transactions that test the boundaries of Radar rules without overtly triggering fraud alerts.\nLeveraging the API to query Radar rule hits or test the rules with hypothetical transaction calls (if such functionality is exposed).\n\nGoals: The goals of an attacker engaging in Account Radar Rule Enumeration include:\n\nAvoiding detection by understanding the specific conditions that trigger fraud reviews or block transactions.\nCrafting fraudulent transactions that have a higher probability of success by staying within the parameters allowed by the rules.\nGaining a granular understanding of the business's risk tolerance as expressed through the configuration of Radar rules, which can inform the scale or nature of the fraud attempt."
