id: FT006.002
stix_id: ''
name: 'Credential Scanning: Websites'
description: |-
  Adversaries may conduct targeted scanning of public-facing websites to identify and exploit login portals, service access points, or administrative interfaces that may contain unsecured or default credentials. These websites could belong to financial institutions, merchants, or entities that process or store sensitive financial data.

  Execution: Attackers can use various automated tools or scripts to discover web pages that may require user authentication. Once these pages are identified, attackers can employ brute-force attacks or use common password lists to attempt to gain access. They often look for poorly secured admin panels, configuration files accidentally exposed to the web, or backup directories that could contain sensitive information, including hardcoded credentials.

  Examples:

  Utilizing tools like directory and file scanners (e.g., DirBuster or GoBuster) to enumerate website directories and file paths that may contain login pages or credential stores.
  Attempting to login using common username and password combinations on known login interfaces found during reconnaissance.
  Scanning for known vulnerabilities in web applications that might allow for the disclosure or bypass of authentication mechanisms.
  Goals: The adversaries utilize this technique with the intent to gain unauthorized access to web-based applications and systems. Such access could allow for fraudulent activities to occur, such as initiating unauthorized transactions, altering account information, siphoning funds, or extracting personally identifiable information (PII) that can be used in further fraudulent schemes.
