name: Refund Fraud
description: |-
  Refund fraud is a deceptive practice where customers exploit a merchant's return policy to obtain a refund through false pretenses. They make legitimate purchases but then falsely claim that the products were never delivered, defective, not as described, or they may return a different or altered item. This fraud can also involve the unauthorized use of someone else’s purchase information to initiate a refund to a different payment method.

  Execution: There are several methods of executing refund fraud, including:

  "Item not received" (INR): The customer claims the item was not delivered, despite delivery confirmation.
  "Significantly not as described" (SNAD): The customer alleges the item received is vastly different from the item advertised.
  "Return item fraud": The customer returns an item that is different or in worse condition than what was initially purchased.
  "Friendly fraud": The customer makes a purchase with their own credit card, receives the product, and then issues a chargeback or refund request with their bank under false claims.

  Examples:

  After ordering an item online and receiving it, the customer falsely claims the product never arrived and demands a refund or replacement.
  A customer returns a purchased electronic device after swapping out its components with older or non-functioning ones, leaving the merchant with a defective return.
  Purchasing high-value items, using them for an event or purpose, and then returning them despite the items being non-defective.
  Reporting a legitimate purchase as an unauthorized transaction to their credit card company to recover the amount spent while retaining the products.

  Goals: The goal for customers committing refund fraud is to receive a product or service without ultimately paying for it, or even to profit by selling the merchandise while also reclaiming the purchase price. They may also seek to exploit return policies for longer-term use of items without purchase commitment.
