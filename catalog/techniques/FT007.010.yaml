tactics: Resource Development
detection: "Monitoring for unusual activities on social media accounts associated with financial institutions or merchants, such as unexpected changes or posts.\n\nImplementing strong security measures, including the use of multi-factor authentication, to prevent unauthorized account access.\n\nTraining for employees on recognizing social engineering tactics and phishing attempts.\n\nSocial media platforms should use automated systems to detect and suspend accounts created with suspicious patterns or funded by potential financial fraud.\n\nRunning awareness campaigns to educate customers and the general public about common social media-based scams.\n\nUse by Fraud Detection and Analysis Teams: \n\nFraud detection teams should closely examine social media accounts linked to financial services for signs of account takeover or unauthorized activities. Automated monitoring tools can analyze patterns of behavior to identify accounts being used for fraudulent activities, such as sudden spikes\
  \ in follower counts, unnatural posting patterns, or the use of certain keywords associated with financial scams. When fraudulent social media activity is detected, rapid coordination with social media platforms is essential for taking down harmful content or accounts and tracing the financial resources used to perpetrate these frauds. Teams should also engage in proactive measures, including reporting mechanisms for customers to report suspected fraud on social media."
