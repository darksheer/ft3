tactics: Defense Evasion & Obfuscation
detection: "Employing document verification systems that cross-check VAT registration numbers and company information with official tax authority databases.\n\nUtilizing advanced scanning techniques that can detect anomalies in document images, such as manipulated texts or altered watermarks and seals.\n\nImplementing machine learning algorithms to recognize patterns indicative of forged documents based on previous instances encountered.\n\nRequiring secondary forms of business verification, such as direct confirmation from tax authorities, or proof of past tax filings.\nMaintaining an active watchlist of known fraudulent VAT numbers and monitoring for their use during merchant account registration.\n\nUse by Fraud Detection and Analysis Teams: \n\nStripe's fraud detection teams are tasked with scrutinizing the legitimacy of VAT certificates submitted during the merchant onboarding process. They utilize a combination of automated tools and manual checks to validate each document. Upon discovery\
  \ of a falsified VAT certificate, teams act swiftly to halt the account setup process, conduct a thorough investigation of the implicated party, and take appropriate legal actions, including reporting the fraud to tax authorities. Continuous improvement of KYC processes in response to evolving fraud tactics is crucial, as is collaboration with international tax agencies to strengthen verification methods."
