name: Account Manipulation
description: "Account manipulation in the context of Stripe accounts involves unauthorized activities by individuals who alter account details to gain control or reroute transactions. This can include changing contact details, manipulating account settings, adding or editing payout schedules and linked bank accounts, or creating unauthorized new user accounts with broad access permissions.\n\nExecution: \n\nTypically, account manipulation begins once an attacker gains access to a Stripe account through phishing, credential stuffing, social engineering, or exploiting software vulnerabilities. Once inside the account, the attacker makes subtle changes that may not immediately alert the account owner. This could involve updating email addresses to intercept notifications and confirmations, changing payout information to divert funds, and modifying security settings to weaken the account's defenses against future unauthorized access.\n\nExamples:\n\nChanging the email associated with a Stripe\
  \ account to one controlled by the attacker, thereby receiving all communications and furthering control.\nModifying the linked bank account details so that all future payouts are transferred to an account the attacker owns.\nAdjusting security settings, for example, by disabling two-factor authentication, making the account more vulnerable to future attacks or easing the takeover process.\nGoals: The objectives of manipulative activities on a Stripe account include:\n\nDiverting funds from legitimate business operations into bank accounts controlled by the attacker.\nMaintaining sustained access for persistent exploitation, potentially for purposes of laundering money, orchestrating further fraud, or selling account access on the dark web.\nGathering confidential business and customer transactional data for malicious use or for sale to third parties."
