name: Churning
description: "Churning, in the context of financial fraud, refers to the process where fraudsters use stolen credit card details repeatedly to conduct transactions until the card's limit is reached or the account's balance is fully drained. This type of fraud is particularly damaging because it can swiftly accrue a significant financial loss for the cardholder before the unauthorized activity is detected and the card is disabled.\n\nExecution: \n\nThe fraudster typically begins with a small 'test' transaction to verify that the stolen card details are active and have not yet been reported. Once this initial transaction succeeds, they rapidly make as many transactions as possible. This often involves making purchases online where immediate verification is not required, or \"cashing out\" by purchasing gift cards, currency, or other easily liquidated items.\n\nExamples:\n\nA criminal gains access to stolen credit card information and starts by conducting a small transaction online to ensure\
  \ the card is valid and functional. After the success of this low-value transaction, they make numerous high-value purchases in succession.\nUsing eCommerce platforms to purchase digital goods or services that do not require shipping and can be quickly resold for cash.\nBuying prepaid debit cards, cryptocurrencies, or other financial instruments that can be immediately used or converted into funds.\n\nGoals: The primary goals of conducting churning fraud include:\n\nQuickly capitalizing on stolen credit card information before the card is canceled or maxed out.\nAcquiring goods or assets that can be anonymized, liquidated, or otherwise converted into cash without traceability.\nMaximizing the financial gain from each set of stolen card details before detection."
