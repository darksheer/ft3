tactics: Defense Evasion & Obfuscation
detection: "Implementing real-time fraud detection systems that can spot and flag rapid sequences of transactions on the same card or account, especially for small-to-large transaction patterns.\n\nUtilizing velocity checking mechanisms, which limit the number of transactions that can be processed on a single card within a set time frame.\n\nRequiring additional authentication for high-value or high-velocity transactions, such as two-factor authentication or callbacks to the cardholder.\n\nContinuous monitoring of accounts for patterns consistent with churning, and immediate action to block transactions and alert cardholders when suspicious activity is detected.\n\nUse by Fraud Detection and Analysis Teams: \n\nFraud detection teams should employ machine learning and transaction monitoring tools to identify patterns and velocities indicative of churning. These include scrutinizing not only the frequency of transactions but also examining the types of goods or services being purchased. Transaction\
  \ thresholds can be dynamically adjusted based on risk levels associated with specific purchasing behaviors. Upon detecting potential churning, the team should freeze the involved transactions and accounts, notify the cardholder, initiate an investigation, and work alongside banks and credit card processors to take preventative and corrective measures. Sharing information regarding identified churning methods can help the broader financial and retail community tighten their defenses against this type of fraud."
