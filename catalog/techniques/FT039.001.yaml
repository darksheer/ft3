tactics: Collection & Exfiltration
detection: "Implementing stringent access controls and monitoring who can configure the Data Pipeline features within Stripe.\n\nEmploying two-factor authentication and approval workflows for any configuration changes within Stripe, especially for features that handle the bulk transfer of data.\n\nRegularly auditing the destination settings of any Data Pipelines to ensure that data is being sent to intended, authorized storage services.\n\nTraining employees on the secure use of data transfer tools and the importance of safeguarding financial data.\n\nUse by Fraud Detection and Analysis Teams: \n\nFraud detection and analysis teams should closely monitor Stripe Data Pipeline configurations and transfers. Automated tools should be used to detect unauthorized alterations or the establishment of new pipelines, trigger alerts on such events, and require validation from verified account holders. Rapid response strategies must be in place to shut down any unauthorized data transfers and to re-secure\
  \ compromised accounts. Post-incident investigations will reveal how the data was transferred and guide subsequent security reinforcement to prevent recurrence. Sharing information with data warehouse providers can also help in tracing illegitimate data transfers and collaborating on broader preventive measures.\n\n"
