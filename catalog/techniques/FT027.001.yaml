id: FT027.001
stix_id: ''
name: 'Account Enumeration: Account Balance Enumeration'
description: |
  Account balance enumeration involves an attacker identifying the financial status of compromised accounts to evaluate their worthiness for further fraudulent activity. The goal is to determine available balances, payout limits, credit limits, and other financial metrics, which falls under reconnaissance as the attacker assesses potential profit from exploiting or manipulating account funds.; Execution: After gaining unauthorized access to an account, attackers explore various financial details available on the account dashboard, in reports, and through API endpoints. Key information includes current available balances, pending payouts, transaction volumes, credit limits for card issuing services, refund reserves, and transfer settings. These insights enable attackers to make calculated moves, such as initiating high-value fraudulent transactions or timing attacks strategically after significant payments are processed but before funds are disbursed.; Examples: Exploring the Balances section of the dashboard to view available and pending balances for various currencies or payment methods.; Using APIs to programmatically retrieve account balance details, payout schedules, and credit limits without alerting account owners.; Assessing payout settings to understand delays and thresholds impacting the timeline for fraudulent actions.; Reviewing transaction history to estimate typical transaction profiles and identify optimal times for fraud.; Goals: Attackers engaging in account balance enumeration aim to: Identify high-value targets with significant balances or transaction throughput for lucrative fraud or theft.; Gain insights into funds flow, including payout frequency and volume to plan fraudulent transfers.; Assess risks associated with attacks, including the likelihood of triggering fraud detection mechanisms based on the account's typical activity.
