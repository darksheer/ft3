tactics: Discovery & Profiling
detection: "Employing alerting mechanisms for any unexpected access to sensitive balance and payout configuration screens within the Stripe account interface.\n\nRegular monitoring of API access logs for anomalous queries related to account balances or settings that deviate from normal operational patterns.\n\nLeveraging machine learning-based anomaly detection to spot unusual transaction volumes or transfer requests in real-time.\n\nEnforcing two-factor authentication and stringent access controls to reduce the risk of unauthorized access.\n\nConducting regular security training and awareness programs for all users who have access to financial data within the Stripe platform.\n\nUse by Fraud Detection and Analysis Teams: \n\nFraud detection and analysis teams should monitor transaction and balance queries both through the Stripe user interface and the API, looking for signs of enumeration such as high-frequency requests or patterned access to financial data indicative of malicious reconnaissance.\
  \ Anomalies should trigger immediate investigation, with possible outcomes including temporary freezing of account funds, resetting of account login credentials, and revocation of API keys if misuse is detected. Communication channels with Stripe support should be established for reporting suspicious activities and seeking their assistance in investigating and resolving suspected account enumeration incidents."
