name: 'No Shipping: Partial Shipping of Goods'
description: "\"Partial Shipping of Goods\" is a strategy used by fraudulent sellers who fulfill only a portion of customer orders, creating a facade of legitimacy to deceive both consumers and fraud detection systems. By selectively shipping some goods, sellers manipulate the perception of their business, making it appear as though they are operating legitimately while they strategically default on other orders. It prolongs the interval before suspicions arise and complaints are filed, allowing fraudsters to continue their deceptive actions and potentially reap more profits before being detected.\n\nExecution: \n\nFraudsters employing the partial shipping tactic usually set up online storefronts, resembling legitimate businesses, where they offer products that may or may not exist. After receiving orders, they fulfill just enough of them to establish a record of deliveries and to seed positive feedback. This selective fulfillment lends credibility to their operation when in reality, a significant\
  \ proportion of customers may never receive their items. Fraudulent sellers might also use this tactic when they hit supply chain issues, deliberately choosing which orders to fulfill based on factors such as customer location, item value, or likelihood of chargeback disputes.\n\nExamples:\n\nA fraudulent e-commerce site sells a range of products and fulfills low-value orders while neglecting high-value ones, banking on customers to forgo pursuing refunds for the cheaper items.\nAn online seller on a marketplace platform ships goods to customers who are most likely to leave reviews or provide feedback, ignoring or delaying shipments to other buyers.\nA fraudulent merchant fulfills initial orders to build a trustworthy seller profile, then starts accepting a large number of orders with no intention of shipping them all.\n\nGoals: The objectives of fraudsters partially shipping goods are to:\n\nMaximize the amount of money made from sales before being flagged by customers or the platform's\
  \ fraud detection mechanisms.\nStretch out the time before a critical mass of complaints triggers an investigation by the e-commerce platform or payment processor.\nConstruct a veneer of trust and reliability by ensuring some positive customer experiences."
