tactics: Manipulation & Fraudulent Transactions
detection: "Implementing system checks that flag discrepancies between the number of orders received and the number of shipments confirmed.\n\nMonitoring seller performance metrics, including delivery rates and customer feedback patterns for signs of inconsistency.\n\nAllowing customers a platform to report issues with sellers, and taking customer complaints seriously especially when there's a pattern of non-delivery reports.\n\nInstituting policies that hold payments in escrow until customers confirm the receipt of goods.\n\nPerforming random spot-checks or quality assurance assessments of sellers known to operate at the margins of acceptable delivery performance.\n\nUse by Fraud Detection and Analysis Teams: \n\nFraud detection teams should be alert to patterns indicative of partial shipping practices, such as consistent negative feedback for non-delivery, while some customers report successful transactions. Analysis of customer complaints, shipping logs, and order fulfillment data should\
  \ be conducted to identify and confirm fraudulent behavior. Upon detection of partial shipping fraud, immediate measures can be taken to suspend the merchant's operations, conduct a thorough review of their activities, and take remedial actions to protect consumers and recover funds. It is critical for teams to work swiftly as such sellers may quickly move on to set up new fraudulent operations under different identities after being discovered."
