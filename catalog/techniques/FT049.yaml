name: Fake Merchant Account
description: |-
  A Fake Merchant Account is a sophisticated fraud technique where attackers establish merchant accounts that appear legitimate but are intended to facilitate various fraudulent activities. Unlike genuine merchants who process payments for legitimate goods or services, fake merchant accounts are set up with the primary intention of executing transaction or merchant fraud. This can involve various illicit activities such as processing stolen credit card information, laundering money, or enabling the purchase of non-existent goods or services.

  Procedure:

  Attackers begin by creating the facade of a legitimate business. This often includes registering a business name, creating a professional-looking website, designing marketing materials, and sometimes even setting up fake product listings or service offerings. The goal is to mimic a real business well enough to pass initial vetting processes used by banks and payment processors.

  Once the fake business is established, attackers apply for merchant services with financial institutions or payment processors. During this stage, they may provide falsified documents, such as business licenses, financial statements, or identification to meet the requirements set forth by the payment processor. They may also use social engineering techniques to convince account managers of their legitimacy.

  After the merchant account is active, attackers can begin processing transactions. They may use stolen credit card data to make fraudulent charges, or they may attract unsuspecting customers to purchase goods or services that will never be delivered. In some cases, these transactions are used as a front to launder money from other criminal activities.
