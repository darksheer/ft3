name: 'Acquire Access: Malvertising'
description: |-
  Adversaries can engage in "malvertising" (malicious advertising) tactics to gain access to users' devices or networks. This technique involves embedding malicious code within digital advertisements, which can result in the download of malware or redirection to fraudulent websites when the ad is clicked. Financial institutions and their customers are prime targets, as access to a single device in the network or a customer’s personal computer could lead to considerable monetary theft or data breaches.

  Execution: Attackers purchase ad space or compromise ad networks to distribute malicious advertisements. These ads often look legitimate but are designed to exploit vulnerabilities within web browsers or other software when interacted with or even just displayed (if a zero-click exploit is used). The malware delivered through such ads may be purposed for credential theft, such as banking trojans or keystroke loggers.
