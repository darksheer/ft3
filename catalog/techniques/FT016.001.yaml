tactics: Initial Access
detection: "Implementing advanced email filtering and anti-phishing technologies to detect and quarantine suspicious communications.\n\nEducating merchants regularly about the latest phishing techniques and telling signs of phishing attempts.\n\nEncouraging the use of two-factor authentication (2FA) for merchant accounts, adding an extra layer of security beyond just a password.\n\nProviding merchants with verified channels for communication and support requests to significantly reduce the chance of phishing.\n\nUtilizing domain monitoring services to identify and take down phishing sites that misuse company trademarks and branding.\n\nUse by Fraud Detection and Analysis Teams: \n\nFraud detection teams must employ both proactive and reactive strategies to combat phishing for merchant credentials. This includes scanning for phishing emails, monitoring web traffic for patterns indicating redirection to known malicious sites, and analyzing login attempts for signs of credential stuffing. In\
  \ the event of a detected phishing campaign, actions might include disseminating alerts to merchants, shutting down impostor domains, and coordinating with hosting providers and law enforcement. Teams should also work with affected merchants to help them recover control over their accounts and mitigate any damage that may have occurred."
