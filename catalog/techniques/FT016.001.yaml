name: 'Phishing: Phishing for Merchant Credentials'
description: "Phishing for merchant credentials is a targeted cybercrime tactic aimed at merchants to acquire their login information for various e-commerce or payment processing platforms. The compromised credentials are then exploited to hijack merchant accounts, manipulate financial transactions, siphon customer payment information, divert funds, or enact other fraudulent activities.\n\nExecution: \n\nThese phishing attacks are often delivered via emails, social media messages, or text messages (smishing) that mimic official communications from payment processors, e-commerce platforms, or financial institutions. Merchants are lured to counterfeit websites that resemble legitimate login pages where they are prompted to enter their account details. These spoofed sites capture the inputted credentials, which are then used by the fraudsters to access the merchant's actual account.\n\nExamples:\n\nAn email sent to a merchant purporting to be from their payment processor, alerting them to a\
  \ problem with their account and requesting they click on a provided link to resolve it. The link redirects to a fake login page designed to harvest credentials.\nA message via social media from a fake account claiming to represent a marketplace platform, instructing the merchant to confirm their account information due to a security update, using a fraudulent website link.\nFraudulent text messages sent to merchants directing them to \"verify\" their account details to prevent their account from being suspended, using a phishing link disguised as an official website.\n\nGoals: The objectives behind phishing for merchant credentials include:\n\nGaining unauthorized access to merchant accounts to divert legitimate payments to accounts controlled by the fraudsters.\nConducting unauthorized transactions, including refunds or purchases, to steal funds or products.\nAccessing sensitive customer data stored in merchant accounts for further exploitation in financial fraud, identity theft, or\
  \ traffic redirection to malicious sites.\nUsing hijacked accounts to set up phishing operations or propagate malware under the guise of a legitimate merchant."
