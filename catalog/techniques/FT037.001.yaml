name: 'Account Manipulation: Additional User Account'
description: "Account manipulation involving the addition of an extra user to a compromised Stripe account is a strategic move that falls under the category of 'command and control' tactics used by cybercriminals. Once an attacker has gained access to a Stripe account, they can abuse the platform's features to add new, unauthorized users. This allows them not only to maintain control over the compromised account but also to establish additional avenues to facilitate illicit activities without raising immediate suspicion.\n\nExecution: \n\nIn the execution of this tactic, an attacker with initial access to a Stripe account uses their level of infiltration to inject a new user with permissions set to levels that enable data access and perhaps transaction capabilities. This is often done stealthily, with contact information that goes overlooked or masquerades as legitimate business contacts. The new user account could be disguised to appear as a legitimate team member, temporary consultant,\
  \ or a third-party service provider.\n\nExamples:\n\nAn attacker, after compromising a merchant's Stripe account credentials, stealthily adds a new user with administrative privileges, effectively setting up a backdoor for uninterrupted access and transaction control.\nFraudulently adding a fake \"audit\" or \"tech support\" account under the guise of performing a routine check or system update, allowing for continued oversight and control by the attacker.\nThe cybercriminal creates multiple user profiles with different access levels to segment their activities and evade detection by spreading out unauthorized actions across these profiles.\n\nGoals: The primary objectives behind adding unauthorized user accounts to a compromised Stripe account are to:\n\nMaintain persistent access to the Stripe account, even if the original breach is discovered and closed.\nManage fraudulent transactions, such as initiating payouts, refunds, or modifying payment flows, through secondary user accounts\
  \ to complicate tracing efforts.\nHarvest sensitive financial data over an extended period, increasing the potential for long-term exploitation."
