tactics: Command and Control
detection: "Implementing alerts for new user additions and requiring multi-factor authentication or secondary approval for all new user account setups within Stripe.\n\nLimiting user roles and permissions strictly based on job functions and reviewing these on a regular basis.\n\nRegularly auditing account activity logs for unusual actions across user profiles, particularly new or infrequently used accounts.\n\nEducating employees about security protocols for adding new users and recognizing social engineering tactics that can be used to justify unauthorized additions.\n\nUse by Fraud Detection and Analysis Teams: \n\nFraud detection teams should continuously monitor for indicators of account manipulation, especially the addition of new users that do not correlate with known company changes or roles. Automated systems can flag new account creation attempts and cross-reference them with verified employee data or known service suppliers. Quick investigative action is required upon detection\
  \ of such anomalies, potentially locking out suspicious accounts, alerting account administrators, and running a full security audit to uncover and remediate any breach. Post-incident, the team should analyze the methods used by attackers to strengthen access controls and prevent similar exploits going forward."
