name: Fake Review Fraud
description: "Fake review fraud involves the posting of false or misleading product or service reviews online. Sellers commit this deception to artificially inflate the reputation and perceived quality of their offerings, thereby attracting more customers. This type of fraud can also direct consumers toward phishing sites or fraudulent payment links by disguising them as positive reviews with high customer satisfaction.\n\nExecution: \n\nFraudulent sellers or third-party services may generate fake reviews themselves or pay for such reviews to be posted. These reviews typically appear on e-commerce platforms, social media, review websites, and other online marketplaces. They're often crafted to appear genuine, complete with fabricated personal narratives and photos, sometimes even using automated ‘review bots’ to produce them en masse.\n\nExamples:\n\nA seller hires a firm that specializes in reputation management to flood their product pages with positive reviews, overshadowing any genuine\
  \ negative feedback.\nPositive reviews are posted along with fraudulent links claiming to offer discounts or additional information, which instead lead to phishing sites.\nSellers cross-post the same set of fabricated positive reviews across different products or platforms to bolster a wider range of offerings.\nA seller uses multiple pseudonymous accounts to post glowing reviews of their products, manipulating trust metrics and review averages.\n\nGoals: The broad goals of engaging in fake review fraud include:\n\nImproving the perceived popularity and quality of the seller's products, thereby driving sales and undercutting competition.\nMisleading consumers into trusting a product or brand that they otherwise might avoid based on authentic reviews.\nSteering potential victims toward malicious sites where their personal and financial information can be compromised."
