name: Compromise Accounts
description: "\"Compromise Accounts\" is a primary cyber threat tactic that refers to the unauthorized access and control of various types of online accounts. It serves as a master technique encompassing specific strategies aimed at breaching and exploiting the security of digital platforms that store sensitive data and provide critical services. Attackers who successfully compromise accounts can access privileged information, financial assets, or leverage the trusted status of an account for further malicious activities.\n\nExecution: \n\nThe execution of account compromise often involves the theft or prediction of passwords, phishing attacks, exploiting software vulnerabilities, or leveraging access gained from other compromised systems. Attackers may use automated tools for credential stuffing, launch targeted phishing campaigns, or install malware that logs keystrokes to capture login credentials. Once inside an account, they can conduct activities ranging from data theft to financial\
  \ fraud, often without the knowledge of the legitimate account owner.\n\nGoals: The goals behind the \"Compromise Accounts\" technique include:\n\nAccessing sensitive personal, corporate, or customer data for theft, sale, or use in blackmail and extortion schemes.\nUsing the compromised accounts as stepping stones for lateral movement within an organization's network or for launching secondary attacks.\nDisguising illicit activities behind legitimate accounts to avoid detection and increase the odds of a successful attack.\nDisrupting operations, damaging reputations, and exploiting the trust established between account holders and their contacts or customers."
