id: FT042.008
stix_id: ''
name: 'Account Manipulation: Top-Up Platform Balance'
description: In this technique, an adversary gains unauthorized access to a merchant's account by compromising credentials or keys. Once inside, the adversary manipulates the account to top up the platform balance without the consent or knowledge of the legitimate account holder. This manipulation involves either using the attached bank account or attaching a new unauthorized bank account to the merchant's platform. The adversary then initiates unauthorized transactions to transfer funds, thereby artificially inflating the account balance. This can be achieved through exploiting system vulnerabilities or leveraging unauthorized promotional credits. By increasing the platform balance, the adversary facilitates unlawful transactions, funds fraudulent activities, or launders illegitimate money through the compromised account. The unintended top-up of platform balances can result in substantial financial losses and pose significant legal and reputational risks for the affected merchant. This
  form of manipulation not only complicates detection and mitigation efforts but also blends fraudulent activities into what appear to be legitimate account actions. Implementing effective detection and response measures is crucial to safeguarding against the financial and operational impacts of this complex fraud technique.
