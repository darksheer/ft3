name: 'Falsifying Business Documents: Fake Business Registration Certificate'
description: "Creating fake business registration certificates is a fraudulent technique used to bypass Know Your Customer (KYC) requirements when establishing new merchant accounts on payment platforms. This involves the production or modification of official-looking documents that purport to represent a legitimate business entity. These fake documents are then submitted during the account registration process to meet the verification standards fraudulently.\n\nExecution: \n\nFraudsters may use sophisticated graphic design software to create counterfeit business registration certificates or alter existing legitimate documents. They'll include false business details like name, address, registration number, and sometimes use the names of real corporate officers without their knowledge. The goal is to present these documents to payment processors as part of the KYC procedure to set up merchant accounts under false pretenses.\n\nExamples:\n\nMimicking legitimate government-issued business registration\
  \ or incorporation certificates, complete with forged signatures and fake corporate seals.\nAltering genuine business certificates by changing details like the business name or registration number to match the fraudster's fake business identity.\nUsing identity theft to add a real person's information to the forged certificate, giving the appearance of legitimacy.\n\nGoals: The primary objectives in falsifying business registration certificates for KYC bypass include:\n\nSetting up merchant accounts for the purpose of laundering money or processing fraudulent transactions without the risk of personal identification.\nGaining access to payment processing tools and platforms to exploit their resources for further financial fraud schemes.\nCreating an appearance of legitimacy to solicit goods, services, or loans from providers who require business verification.\n"
