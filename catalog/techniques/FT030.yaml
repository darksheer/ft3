name: Card Testing
description: "Card testing is a fraudulent activity where cyber criminals test the validity of stolen credit card information. This is often done by making small online transactions or donations through payment processing platforms like Stripe. If a small transaction succeeds without triggering fraud detection mechanisms, the attackers gain confidence that the card can be used for larger, more lucrative purchases or fraudulent transactions.\n\nExecution: \n\nAttackers often use automated scripts or bots to perform card testing, submitting numerous small transactions on various websites including e-commerce stores, donation forms, and subscription services. For platforms like Stripe, which provide extensive API support for payment processing, such scripts might hit the API directly. These \"micro-charges\" are small enough to go unnoticed by cardholders but in aggregate can confirm the validity of thousands of stolen card numbers.\n\nExamples:\n\nMaking a series of low-value purchases or\
  \ donations on various websites using different stolen card details to confirm which cards are active and haven't been reported lost or stolen.\nSubmitting many small transactions via Stripe's API or through a compromised business account that utilizes Stripe for payment processing.\nAutomating attempts to add small credits to digital wallets, using Stripe for payment processing, thereby validating which cards can be exploited further.\n\nGoals: The goals of an attacker engaged in card testing are:\n\nTo identify and compile a list of valid and active credit card details that can be used in high-value fraudulent transactions or sold on the dark web.\nTo determine the fraud detection thresholds, usually based on transaction amount and frequency, thereby understanding how to structure larger fraudulent transactions to avoid triggering alerts.\nTo exploit the tested card data swiftly and efficiently before the theft is detected and the cards are canceled or flagged by financial institutions."
