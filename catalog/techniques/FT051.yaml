name: Fraudulent Purchases
description: |-
  Under the Financial Evasion, Laundering, and Cash-Out tactic, "Fraudulent Purchases" refers to activities where bad actors use stolen credit card information, fraudulent accounts, or money laundering methods to buy goods or services. These transactions are intended to convert illegally obtained funds into legitimate assets, evade detection by financial authorities, or cash out funds for clean money.

  Execution: Fraudsters make purchases using stolen credit card details or through compromised financial accounts on e-commerce sites, through payment processors like Stripe, or brick-and-mortar retailers with online payment capabilities. In some cases, they may purchase high-value items that are easily resalable in secondary markets or convert funds into cryptocurrencies or gift cards to launder the money.

  Examples:

  Buying luxury items with stolen credit card information to later sell for cash, thus cleaning part of the illegally obtained funds.
  Purchasing goods or services to be delivered to a drop address, from where the purchased items can be safely retrieved by the criminal or an associate.
  Using fraudulently obtained funds to purchase gift cards or digital items, which either have anonymous resale value or can be used without revealing the buyer's identity.
  Goals: The primary goals of engaging in fraudulent purchases are:

  Liquidating stolen financial assets before the theft is detected and the account or cards are frozen.
  Laundering money by turning illicit funds into physical goods that can be disposed of for 'clean' money.
  Obtaining goods or services for personal use or profit without the intention of legitimate payment.
