id: FT042.002
stix_id: ''
name: 'Account Manipulation: Additional Linked Account'
description: "In reference to Stripe accounts, the \"Account Manipulation: Additional Linked Account\" technique involves unauthorized actors linking other Stripe accounts to a compromised primary account. This manipulation could potentially allow attackers to transfer funds, access sensitive customer data, and perform activities on behalf of the compromised account without the account holder's knowledge.\n\nExecution: \n\nA malicious actor with access to a Stripe account, through credential compromise or other methods, may exploit Stripe's capabilities to link multiple accounts. For instance, they may add an account to facilitate the transfer of funds in a platform-native manner. The attacker could also use linked accounts to disperse funds more discreetly or leverage the increased transactional capabilities often associated with aggregated Stripe accounts.\n\nExamples:\n\nAfter gaining access to a business's primary Stripe account, the attacker links a secondary account they control, allowing\
  \ for fund redirection or consolidated payment processing across the accounts.\nUsing linked accounts as a means to obfuscate financial trails during other fraudulent activities, such as money laundering or unauthorized withdrawals.\nThe attacker connects to a series of accounts at different transaction levels, using the network of accounts to perform larger-scale fraudulent transactions that may be detected if attempted through a single account.\n\nGoals: The goals behind linking additional unauthorized accounts typically include:\n\nExpanding the fraudulent control over a network of accounts to facilitate large-scale financial theft.\nHiding and laundering the origins of ill-gotten gains by transferring funds between linked accounts.\nIncreasing the complexity and scope of fraudulent schemes by taking advantage of the varied functionalities and limits across multiple accounts."
