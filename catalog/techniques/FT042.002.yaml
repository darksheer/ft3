tactics: Financial Evasion, Laundering & Cash-Out
detection: "Setting up system alerts within Stripe for newly linked account notifications, triggering a confirmation or additional verification process.\n\nEnforcing the requirement of multi-factor authentication and secondary approval for linking new accounts, especially if they involve fund routing capabilities.\n\nRegularly conducting reviews and audits of all linked accounts, tracking their activities against instances of fraud or other unauthorized transactions.\n\nOffering guidance and security training to account users on handling account link requests and the importance of monitoring their account for unexpected changes.\n\nUse by Fraud Detection and Analysis Teams: \n\nFraud detection teams need to stay vigilant against unauthorized account linkages. This can be achieved by implementing analytics to monitor for anomalies that may indicate account takeovers, such as a sudden increase in linked accounts or uncharacteristic money flow patterns. If suspicious activity concerning account\
  \ linkage is observed, immediate action should be taken to verify the legitimacy of the linked accounts and to potentially disable fraudulent connections. Post-incident actions would involve a thorough investigation to prevent similar occurrences and secure all affected accounts. Additionally, working with customers to educate them about monitoring their Stripe accounts for unauthorized changes can aid in early detection and deterrence of such fraud tactics.\n\n"
