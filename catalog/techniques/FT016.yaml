name: Phishing
description: |2
   Phishing is a deceptive practice where fraudsters impersonate legitimate entities to lure individuals into providing sensitive data, such as login credentials, payment information, or personal identification details. For merchants and customers using financial platforms, phishing campaigns can closely mimic official communications, posing significant risks such as account takeovers, unauthorized transactions, and data breaches.; Execution: Attackers craft emails, text messages, or fake websites that closely resemble official branding and messaging, tricking recipients into believing the communication is genuine. Phishing messages may claim to address issues with accounts, request confirmation of details, prompt password changes, warn of unauthorized logins, or offer discounts and refunds. These messages usually include a call-to-action, directing users to counterfeit login pages or forms designed to harvest credentials. Examples: Email campaigns directing merchants to a fake login page under the guise of verifying accounts to continue receiving payments.; SMS phishing (smishing) targeting users with links for supposed refunds or account suspensions.; Communications mimicking support to resolve non-existent account problems, asking customers to log in via included links. Goals: Phishing campaigns generally aim to: Obtain login credentials for unauthorized access and financial theft.; Capture credit card data and personal information for fraudulent transactions, identity theft, or resale on the dark web.; Build trust for more targeted social engineering schemes (spear-phishing) against high-value targets with significant funds processed.
