tactics: Initial Access
detection: "Educating Stripe users and merchants about the signs of phishing attempts, such as checking the sender's email address, looking for misspellings, and verifying email authentication markers.\n\nEncouraging users to directly navigate to the official Stripe website or contact Stripe support through official channels when they receive suspicious communications.\n\nDeploying email filtering tools that can recognize and block phishing emails before they reach users' inboxes.\n\nImplementing two-factor authentication for all Stripe account access, which reduces the risk even if credentials are compromised.\nMonitoring transaction patterns for signs of fraud that might indicate a successful phishing attempt.\n\nUse by Fraud Detection and Analysis Teams: \nFraud detection teams must actively scan for and respond to phishing threats targeting the Stripe community. This includes verifying the authenticity of suspected phishing sites, taking them down, and alerting users to the threat. Outreach\
  \ and engagement—such as providing clear channels for reporting phishing, issuing warnings about current phishing trends, and keeping the Stripe community updated on security practices—can greatly reduce the success rate of phishing attacks. When phishing is detected, immediate steps such as communicating with impacted users, advising them to change passwords, and reviewing account activities for unauthorized actions, are crucial in mitigating harm."
