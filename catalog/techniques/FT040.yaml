name: Carding Markets
description: "Carding markets are clandestine online forums or shops found on the dark web where cybercriminals trade and sell stolen credit card information. These stolen credit card details are later used to perform unauthorized transactions on payment platforms like Stripe. Fraudsters acquire these details to make illegal purchases, transfer funds, and engage in various forms of financial deception.\n\nExecution: \n\nOnce obtained from carding markets, the stolen credit card information is tested and used by fraudsters to set up or hijack existing Stripe accounts. They may then execute unauthorized transactions, buy goods or services, or even process fraudulent charges to launder money. These activities are often part of a larger operation that might include money laundering, funding for other illicit activities, or direct theft.\n\nExamples:\n\nA cybercriminal purchases a batch of stolen credit card numbers from a carding market and uses them to make unauthorized purchases on e-commerce\
  \ sites that process payments via Stripe.\nFraudsters use stolen cards to donate to fake charity campaigns processed through Stripe, allowing them to cash out.\nTesting stolen credit card validity by making small donations or purchases via Stripe-enabled platforms before moving on to larger fraudulent transactions.\n\nGoals: The primary goals of participating in carding markets with the intent to use Stripe for fraud are:\n\nTo exploit stolen financial information for personal gain before the cards are canceled or flagged by financial institutions.\nTo launder digital funds through seemingly legitimate retail or service transactions on the Stripe platform.\nTo engage in high-volume theft quickly, given the short window before the stolen card details are detected and blocked."
