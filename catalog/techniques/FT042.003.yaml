name: 'Account Manipulation: Additional Buy Now, Pay Later'
description: "The \"Buy Now, Pay Later\" (BNPL) option is a flexible payment solution that Stripe offers merchants to allow their customers to defer payments while receiving goods or services immediately. Within the context of account manipulation, fraudsters may add or exploit the BNPL feature within a compromised Stripe account to conduct unauthorized transactions, increase credit exposure, or engage in financial fraud.\n\nExecution: \n\nAfter gaining unauthorized access to a Stripe account, either through phishing or other account takeover techniques, an attacker manipulates the BNPL settings. This could involve enabling BNPL options on a merchant's account without consent, altering the terms of existing BNPL offerings, or configuring the feature to reroute subsequent payments to fraudulent accounts.\n\nExamples:\n\nEditing the terms of a BNPL plan to extend the payment period, giving the fraudster a longer time frame to exploit charged but unpaid-for items or services.\nConfiguring additional\
  \ BNPL plans and associating them with high-value items, creating a financial liability for the merchant by allowing excessive deferrals of payment.\nEnticing customers to select BNPL at checkout on an e-commerce platform by offering unusually lenient terms, then utilizing the delay before payment collection to move or launder the anticipated revenues without delivering the goods.\n\nGoals: The goals behind manipulating \"Additional Buy Now, Pay Later\" configurations in Stripe accounts include:\n\nDeferred transaction visibility, allowing fraudsters to obfuscate their activities among genuinely pending transactions and delay detection.\nExploiting the credit system to perpetrate financial fraud such as the creation of synthetic identities or compounding credit to be exploited in a bust-out fraud scheme.\nLeveraging BNPL plan manipulations to facilitate money laundering by creating illegitimate transactions that will receive later payment."
