id: FT006.001
stix_id: ''
name: 'Credential Scanning: Github'
description: |-
  Adversaries may perform automated scanning of GitHub repositories to identify credentials that have been accidentally committed and left publicly accessible. GitHub, a popular platform for code management and collaborative programming, can inadvertently become a treasure trove of sensitive information if proper care isn't taken.

  Execution: Attackers employ bots or scripts that scour repositories and their associated commit history for patterns that match common credential formats. This includes looking for strings associated with private keys, API tokens, passwords, or access tokens for a variety of services that might be used by financial organizations. They may specifically target high-value repositories belonging to financial institutions or payment gateways, where access credentials can lead to significant unauthorized transactions or data breaches.

  Examples:

  Searching for files with names that include key, secret, token, credential, or any other keyword indicative of sensitive data.
  Looking for specific patterns that match common credential formats, such as AWS access key IDs (AKIAxxxxxxxxxxxxxxxx) or private SSH keys (-----BEGIN PRIVATE KEY-----).
  Goals: The primary goal for adversaries using this technique is to gain unauthorized access to systems, services, or data stores that the credentials provide access to. This access can be used to facilitate fraudulent transactions, siphon funds, manipulate account balances, or extract sensitive financial data.
