tactics: Reconnaissance
detection: |-
  Implementing Git hooks that scan for and prevent the pushing of commits containing sensitive information.

  Employing automated code scanning tools within the CI/CD pipeline to detect and alert on hard-coded credentials.

  Frequent auditing of repositories for inadvertent credential exposure.

  Enforcing policies that require the use of environment variables or secret management systems instead of hard-coded credentials.

  Training developers on secure coding practices, emphasizing the importance of keeping credentials out of source code.

  Revoking and rotating credentials as soon as possible if exposure is detected.

  Use by Fraud Detection and Analysis Teams: Fraud detection teams should monitor for unauthorized access and unusual activities that could suggest the use of compromised credentials. Automated alerting and anomaly detection systems can be configured to flag large or irregular transactions, access from anomalous locations, or the usage of credentials in unexpected ways. Additionally, maintaining a baseline of normal activity will assist in quickly identifying deviations that warrant investigation.
