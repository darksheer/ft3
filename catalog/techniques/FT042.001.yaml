name: 'Account Manipulation: Additional Payment Methods'
description: "Account manipulation involving the addition of new payment methods often refers to unauthorized activities whereby fraudulent actors or cybercriminals add new credit cards, bank accounts, or other financial instruments to a compromised account. This can occur across various platforms, including e-commerce sites, payment processing services, or online banking systems, allowing attackers to funnel funds to controlled destinations or make unauthorized purchases.\n\nExecution: \n\nUsing stolen credentials or exploited system vulnerabilities, attackers access a user’s online account and navigate to the payment settings. Here they can enter new payment details which might involve stolen credit card numbers or bank account information. They might use these new payment methods immediately for fraud or position them for future use, laying the groundwork for further financial deceit.\n\nExamples:\n\nInserting a fraudulent payment method into a compromised e-commerce account to make unauthorized\
  \ purchases that ship goods to a location controlled by the attacker.\nAdding a new credit card to an online payment gateway and quickly draining the credit from the card through illegitimate transactions.\nInfiltrating a mobile wallet application to add new credit cards under the user's profile, which are then used to transfer funds or make purchases.\n\nGoals: The primary goals of adding unauthorized payment methods to accounts are to:\n\nPerform financial theft directly by purchasing goods or services using the added payment methods.\nCarry out money laundering by channeling funds through various added payment instruments, complicating the money trail.\nExploit and maximize the financial gain from stolen financial data before the victim detects the fraud and cancels or secures their payment methods."
