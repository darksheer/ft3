name: Account Access Removal
description: "Account Access Removal is a form of account takeover where a malicious actor, after gaining unauthorized access to an online account, proceeds to remove or alter the account's access controls to lock out the legitimate owner. This may involve changing login credentials, modifying account recovery information, or even manipulating user roles within enterprise systems to limit the original owner's ability to access or regain control of the account.\n\nExecution: \n\nThe attacker first breaches the account through various means, such as phishing, credential stuffing, or exploiting security vulnerabilities. Once inside the account, they quickly alter the account's email addresses, passwords, security questions, or associated phone numbers to prevent the legitimate owner from logging in or using standard recovery processes. In corporate environments, this may also involve changing permissions to remove access for specific user roles or individuals.\n\nExamples:\n\nAfter compromising\
  \ a personal email account, a fraudster changes the account’s password and recovery email, effectively locking out the true owner.\nA cybercriminal gains access to a business social media account and revokes admin rights for all other legitimate users, taking sole control of the account.\nWithin a cloud service platform utilized by a business, an attacker with elevated privileges removes access rights for other administrators and users post-account takeover.\n\nGoals: The goals behind Account Access Removal include:\n\nMaintaining control over the compromised account for as long as possible to complete fraudulent activities.\nPreventing the original owner or organization from detecting and responding to the anomalous activities occurring within the account.\nUsing the stolen account to perpetrate additional fraud, gather intelligence, disrupt business activities, or demand ransom for the return of access."
