tactics: Command and Control
detection: "Monitoring for unusual account activity, such as the creation of new user accounts or changes to user permissions, especially outside of regular business hours or from unfamiliar IP addresses.\n\nImplementing strict internal policies and training regarding account access requests and the addition of new team members or roles within Stripe accounts.\n\nEmploying multi-factor authentication (MFA) for all account changes, including the addition of new users, and requiring secondary approval or verification for such modifications.\n\nUtilizing Stripe’s team audit logs to regularly review changes to team member settings and permissions, ensuring they match authorized changes.\n\nUse by Fraud Detection and Analysis Teams: \n\nFraud detection teams must be vigilant in identifying potential unauthorized additions to Stripe accounts. Automated monitoring tools can detect and alert to any account changes in real-time. Any suspicious activity should prompt immediate investigation, with\
  \ rapid revocation of access for any new accounts pending verification. Following the detection of an unauthorized addition, teams need to review and enhance account security measures, assist the affected users in safeguarding their accounts, and investigate the root cause to adjust preventive strategies and avoid future breaches."
