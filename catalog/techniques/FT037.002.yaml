name: 'Account Manipulation: Additional Authorized Account'
description: "In the context of a payment processing platform like Stripe, account manipulation through the addition of an additional authorized account refers to Fraudsters gaining unauthorized access to a Stripe user's account and then adding new user accounts or permissions. This allows the attacker to maintain access, conduct unauthorized financial transactions, manage payment flows, and potentially facilitate other fraudulent activities, all while masquerading as a legitimate user of the account.\n\nExecution: \n\nThe attacker, after gaining initial access to the Stripe account, either through phishing, exploiting a vulnerability, or using stolen credentials, will add new team members or user accounts with permissions that allow for complete or partial control of the account. These newly added accounts often have administrative rights or privileges necessary to initiate transactions, alter payment settings, manage API keys, or view sensitive financial reporting data.\n\nExamples:\n\n\
  A fraudster accesses a Stripe account by compromising the account owner's login details. They then add a new user under the pretense of a trusted team member, granting this account comprehensive control over payments and settings.\nAfter taking over a Stripe account, attackers add multiple new users with varying degrees of access, better spreading out and camouflaging their illicit activities among seemingly legitimate account activity.\nAn attacker uses the guise of a new employee or consultant to request access to the company’s Stripe account, which is then used to manipulate transaction flows or abscond with customer payment information.\n\nGoals: The goals of attackers when adding additional authorized accounts to a compromised Stripe account include:\n\nContinuously accessing the Stripe account for ongoing exploitation without the knowledge of the legitimate account owner.\nUtilizing the account to siphon funds to accounts held by the attacker.\nConducting surveillance and exfiltrating\
  \ sensitive financial data over an extended period.\nLaying the groundwork for larger financial fraud schemes or ransom events by establishing backdoor access to payment systems."
