name: 'Account Manipulation: Additional Linked Account'
description: "In the context of Stripe, an account manipulation tactic known as \"Additional Linked Account\" involves unauthorized actors adding new bank accounts or payment methods to an existing Stripe account. This action serves as a method of command and control, wherein the attackers exert influence over the financial transactions and fund flows within the compromised account.\n\nExecution: \n\nAfter gaining initial unauthorized access to a Stripe account, perhaps through compromised credentials or social engineering, attackers add new, externally controlled bank accounts or payment methods. These newly linked accounts are set up to receive fraudulent payouts or redirect legitimate transaction revenues. The manipulation often goes undetected by the legitimate account holders initially because it doesn't require changing existing payout setups; it merely adds to them.\n\nExamples:\n\nAltering the settings of a compromised merchant Stripe account to link an additional bank account owned\
  \ by the fraudster, thereby diverting future payouts.\nFraudulently adding a debit card under the attacker's control to victim's Stripe account, allowing instant payouts and fast extraction of funds.\nSetting up an additional withdrawal method on a Stripe account after gaining access, which can be activated by the attacker at a time of their choosing.\n\n\nGoals: The goals behind adding an additional linked account to a compromised Stripe account include:\n\nEstablishing a method of funneling funds from sales or other financial transactions to an account that the attacker controls.\nMaintaining a stealthy form of access that enables ongoing exfiltration of funds without necessarily highlighting any immediate suspicious activity that might alert the account owner.\nCreating redundancies in payout methods, ensuring that even if one illegitimate channel is closed, others still exist to continue financial exploitation."
