name: Account Manipulation
description: "Account manipulation is a broad cybercriminal technique that involves unauthorized modification of account settings, often aimed at financial gain or unauthorized access to resources. This overarching technique includes a variety of methods attackers use to exploit or alter account details, payment methods, or financial scheduling arrangements, typically within digital financial services or e-commerce platforms.\n\nExecution: \n\nThe execution of account manipulation can vary widely, based on the attackers' objectives and the type of account targeted. Generally, it involves using stolen credentials or exploiting system vulnerabilities to gain access to an account, then making unauthorized changes to the account's financial or administrative settings.\n\nGoals: The goals behind Account Manipulation as a master technique broadly include:\n\nDiverting or stealing funds from compromised accounts.\nEstablishing ongoing mechanisms for extracting monetary value from fraudulent activities.\n\
  Obscuring the trail of financial transactions to complicate tracking by law enforcement or fraud detection systems.\nExploiting financial services and features to facilitate broader fraud campaigns, like identity theft or financial account takeovers."
