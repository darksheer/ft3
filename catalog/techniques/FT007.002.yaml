tactics: Resource Development
detection: "Regularly updating DNS server software to patch vulnerabilities and reduce the risk of exploitation.\nEnforcing strong authentication mechanisms, including multi-factor authentication for administrative access.\n\nEmploying network segmentation to limit the extent of access an attacker might gain from compromising a single DNS server.\n\nContinuous monitoring for suspicious changes in DNS records and traffic patterns.\n\nImplementing DNSSEC (DNS Security Extensions) to protect against unauthorized DNS alterations.\n\nUse by Fraud Detection and Analysis Teams: \n\nFraud detection teams should monitor network traffic for anomalies that could suggest DNS tampering, such as unexpected redirections or spikes in DNS queries. Regular audits of DNS records against known good baselines are essential to detect unauthorized changes. Alerting mechanisms should be in place to notify when changes are made to DNS records, especially those affecting critical financial systems. Using threat intelligence\
  \ feeds can help in early detection of campaigns targeting DNS servers within the financial sector."
