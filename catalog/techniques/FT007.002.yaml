name: 'Acquire Access: DNS Server'
description: |
  DNS Server Exploitation in Financial Cyber Fraud; Overview: Adversarial actors in the financial cyber fraud realm target DNS servers associated with financial services to redirect legitimate traffic to malicious domains, known as DNS hijacking or manipulation. This can lead users to phishing sites that mimic legitimate services, aimed at stealing credentials, financial data, or siphoning funds.; Execution: Attackers may use various techniques to compromise DNS servers, including: Exploiting Vulnerabilities: Taking advantage of security weaknesses in DNS infrastructure.; Social Engineering: Manipulating personnel responsible for DNS settings.; DNS Poisoning: Altering DNS records in resolver caches to redirect traffic. By modifying DNS records to point to malicious IP addresses, attackers can reroute users to sites they control.; Examples: Gaining unauthorized administrative access to DNS servers and modifying Address (A) or Canonical Name (CNAME) records linked to financial service domains.; Deploying malware or man-in-the-middle attacks to modify local DNS resolver caches, resulting in traffic diversion.; Conducting DNS poisoning attacks on upstream DNS providers to hijack traffic intended for genuine financial services.; Goals: The objectives of this DNS-based financial cyber fraud include: Credential Capture: Intercepting user credentials, payment card information, and other sensitive financial data.; Financial Theft: Facilitating unauthorized transactions from victims’ accounts to those controlled by attackers.; Long-term Exploitation: Establishing further malicious activities, such as deploying malware on victims’ systems for continual financial exploitation.
