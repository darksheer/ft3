name: Account Deletion
description: "Account deletion in the context of a compromised system refers to the strategic removal or disabling of user profiles, which were either fraudulently created or hijacked by attackers. This action is typically used to erase traces of unauthorized activities and to hinder investigation efforts once fraudulent operations have been completed.\n\nExecution: \n\nAfter securing illegal gains through a compromised user account, fraudsters may opt to delete the account to remove any direct link to their activities. This can involve using the platform's standard deletion process or, if the attackers have gained higher-level administrative access, removing logs and records that point to their interference. The objective is to leave behind as little evidence as possible, making it more difficult for forensic teams to trace the fraud back to them.\n\nExamples:\n\nAfter using a compromised Stripe account to illicitly transfer funds, the criminals delete the account to obscure their actions.\n\
  An attacker with administrator privileges deleting user access logs after conducting unauthorized transactions, aiming to erase their digital footprint.\nFollowing a data exfiltration incident, the perpetrator deletes the compromised accounts to remove any signs of the breach.\n\nGoals: The principal goals of deleting a compromised account to hide fraudulent activities include:\n\nDestroying evidence that could be used to track the attackers' identity or methods.\nDelaying the discovery of the fraud, giving attackers more time to utilize stolen data or funds before a response can be mounted.\nReducing the likelihood of the compromise being linked to any subsequent fraudulent activities performed with the stolen resources."
