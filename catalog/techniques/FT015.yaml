name: Policy and Procedure Abuse
description: |
  Policy and Procedure Abuse Overview: Policy and procedure abuse involves exploiting established practices and guidelines within an organization to gain unauthorized access to systems or information. Attackers may manipulate these policies, particularly in the context of financial accounts, to obtain access and bypass security controls, leading to fraudulent transactions, access to sensitive customer data, or disruptions in business operations.; Execution: Attackers exploit vulnerabilities in customer service practices, account recovery processes, or security protocols. They might use social engineering tactics to deceive support staff into granting access or navigate the password reset process using publicly available or previously compromised information to impersonate legitimate account holders. Examples: Posing as a legitimate account holder using previously leaked personal data to pass security checks.; Exploiting lax verification procedures during password resets to hijack accounts.; Convincing customer support to override security protocols and manually grant access to account information under false pretenses.; Goals: The main objectives of policy and procedure abuse to gain initial access include: Gaining control over online financial accounts to facilitate unauthorized transactions and siphon funds.; Harvesting sensitive customer and transactional data for malicious purposes.; Disrupting business operations by altering financial routing information, initiating fraudulent refunds, or manipulating account settings.
