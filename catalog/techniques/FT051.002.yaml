name: 'Fraudulent Purchases: SMS Services'
description: |-
  Fraudulent purchases of SMS services involve unauthorized transactions where cybercriminals use stolen financial information or illicitly acquired funds to buy SMS-related services. These services may include bulk SMS packages, premium text message subscriptions, or other text message-based services often used in marketing or communications. This activity can serve as a method for laundering money by disguising fraudulent transactions as legitimate business expenses.

  Execution: Using stolen credit card details or compromised bank accounts, fraudsters subscribe to or purchase SMS services, potentially to use in further fraudulent schemes like smishing (SMS-based phishing), spam campaigns, or to bolster the appearance of a legitimate business operation. These services may be chosen specifically for their recurring billing nature, allowing for consistent and ongoing charges to be made against the stolen financial information.

  Examples:

  A criminal group leveraging stolen credit card numbers to buy large quantities of SMS credits from a marketing service provider, which are then used to send out mass phishing texts.
  Purchasing subscriptions for premium SMS content using compromised accounts to repeatedly charge the accounts and launder funds through the service provider.
  Setting up automated, subscription-based premium SMS services that charge stolen credit cards monthly and use reshipping or mule networks to extract the laundered money.
  Goals: The goals behind fraudulent purchases of SMS services typically encompass:

  Laundering illegally obtained funds through continuous billing cycles of SMS services and blending these transactions with legitimate business costs.
  Utilizing purchased SMS services to facilitate additional criminal activates like phishing, scamming, or distributing malware.
  Evading detection by financial authorities or fraud detection systems which might not readily flag SMS service purchases as suspicious.
