name: 'Fraudulent Purchases: Subscriptions'
description: |-
  Fraudulent purchases of subscriptions refer to the unauthorized procurement of recurring services or products, which can be part of a financial evasion, laundering, or cash-out strategy. Fraudsters use stolen payment credentials, such as credit card information, to set up subscription services that create a continuous cash flow.

  Execution: Cybercriminals obtain and use stolen or fabricated financial information to sign up for subscription-based services—ranging from online streaming platforms to software-as-a-service (SaaS) offerings. These services are chosen due to their recurring payment model, which fraudsters exploit to move illicit funds or to monetize stolen credit card details. They may also sell access to these fraudulently obtained subscriptions in underground marketplaces.

  Examples:

  Setting up multiple entertainment or software subscriptions using stolen credit card details, which provide the fraudster with services that can later be sold at a discounted rate on secondary markets.
  Exploiting subscription sign-ups as a laundering technique, using the monthly charges as a way to regularly extract funds from compromised bank accounts or credit lines.
  Engaging in 'subscription stuffing' where stolen credentials are tested en masse on various subscription platforms, looking for active and unmonitored accounts to exploit.
  Goals: The objectives of using fraudulent purchases for subscriptions in the context of financial crimes include:

  Establishing a steady, unauthorized outflow of funds from stolen financial details, effectively laundering money with each recurring payment.
  Utilizing subscription services as a consistent method to cash out funds through reselling access.
  Obscuring financial transactions within the legitimate billing activity of subscription services to minimize detection.
