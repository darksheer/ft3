tactics: Resource Development
detection: |-
  Implementing robust patch management policies to ensure that all servers are regularly updated with the latest security patches.

  Enforcing strict access controls and regularly reviewing permissions to limit and monitor who has access to critical servers.

  Utilizing multi-factor authentication and strong password policies to guard against unauthorized access attempts.
  Conducting regular network penetration tests and vulnerability assessments to uncover potential weaknesses.

  Deploying network segmentation to reduce the ability of an adversary to move laterally within the network if a server is compromised.
  Installing and maintaining an Intrusion Detection System (IDS) or an Intrusion Prevention System (IPS) to detect and potentially prevent malicious activity.

  Continuous monitoring of security logs for anomalous activities that could indicate attempts to gain unauthorized server access.

  Use by Fraud Detection and Analysis Teams: Fraud detection and analysis teams should closely monitor the integrity of transactional data and access logs. In the case of a financial institution, anomalies in transaction processing or unusual administrative activities may signal unauthorized access to servers. Teams should also keep abreast of the latest threat intelligence reports to understand emerging tactics and adjust defensive measures accordingly. Engaging in proactive threat hunting within the network can help uncover covert attempts to acquire server access before they result in financial losses or data breaches.
