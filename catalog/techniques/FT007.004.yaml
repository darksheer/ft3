id: FT007.004
stix_id: ''
name: 'Acquire Access: Server'
description: |-
  Adversaries may seek to acquire access to critical servers that are part of the infrastructure of financial institutions or payment processing centers. Gaining unauthorized access to such servers can allow attackers to manipulate transaction processing, harvest sensitive financial data, or compromise other systems within the network.

  Execution: Attackers might exploit security weaknesses, such as unpatched vulnerabilities, use stolen credentials, or deploy phishing techniques to trick employees into providing access. They may also leverage physical attack vectors if the server is not properly secured, or insider threats by colluding with someone who has legitimate access.

  Examples:

  - Exploiting vulnerabilities in server software (e.g., SQL injection on a web server that processes online transactions).
  - Using credential phishing or credential stuffing to gain access to an administrative console or remote access interface.
  - Planting malware through social engineering or compromised third-party software to establish a foothold on the server.
  - Colluding with an insider to obtain direct access to the server or to credentials that provide such access.

  Goals: The goal of acquiring access to servers in the financial sector is multifaceted: adversaries may aim to conduct financial theft, interfere with transaction processing, initiate unauthorized transfers, manipulate balances, or compromise personal and financial data of customers. Additionally, access to a server can facilitate the lateral movement within the institution’s network, leading to broader systemic compromises.
