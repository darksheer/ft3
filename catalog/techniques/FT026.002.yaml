name: 'Falsifying Business Documents: Fake Business License'
description: "Falsifying business documents, particularly a fake business license, is a fraudulent act committed by individuals attempting to bypass Know Your Customer (KYC) controls when setting up a merchant account on financial platforms such. The fake business license is intended to mimic an official government-issued document that grants permission to an individual or company to conduct business in a particular jurisdiction.\n\nExecution: \n\nPerpetrators produce counterfeit business licenses using a variety of methods, including graphic design software to create a document from scratch or altering an existing one. These forgeries often include seemingly legitimate business information, such as a fake company name, address, and license number, as well as forged signatures and official seals. The documents are then presented during the merchant account registration process to falsely satisfy KYC requirements.\n\nExamples:\n\nCrafting a business license that looks identical to real government-issued\
  \ licenses, including watermarks, stamps, and barcodes intended to deceive verification checks.\nUsing photo editing tools to alter the details on an authentic business license to match the fraudulent company the attacker wishes to register.\nSubmitting a completely fabricated business license document that asserts the existence of a company that does not actually exist.\n\nGoals: The goals behind the use of fake business licenses in KYC bypass include:\n\nEstablishing a merchant account under false pretenses for the purpose of money laundering, executing fraudulent transactions, or perpetrating other financial scams.\nCreating the perception of a legitimate business operation to gain access to credit, goods, or services from third-party vendors.\nObtaining entry to payment processing networks, thereby facilitating broader financial deceit or cybercrime activity."
