name: Credit Card Skimming
description: |-
  Credit card skimming in the cyber domain refers to the unauthorized capture of credit card information by inserting malicious code into the front-end of e-commerce websites, known as digital skimming or e-skimming. This can happen through compromised third-party scripts or direct attacks on the website. The stolen credit card data — often including card numbers, expiration dates, and CVV codes — is then transmitted to servers under the control of cybercriminals.

  Execution: Attackers typically execute credit card skimming by injecting malicious JavaScript code into payment pages on e-commerce sites, often by exploiting vulnerabilities in the site itself or in third-party services integrated with the site. This code runs in the user’s browser when they enter their payment details and surreptitiously sends a copy of the data to a server controlled by the attackers.

  Examples:

  Infiltrating a website through outdated plugins or insecure admin credentials and adding skimming code to the website's payment form processing scripts.
  Compromising widely used third-party scripts, such as those for customer service chatboxes, analytics tools, or ad networks, and using them to inject the skimming code on multiple websites simultaneously.
  Creating entire phishing websites that resemble legitimate e-commerce platforms designed to harvest credit card information from unsuspecting victims.

  Goals: The goals of attackers engaging in credit card skimming are to:

  Collect as much credit card data as possible from unsuspecting victims for unauthorized purchases, fraudulent transactions, or sale on the dark web.
  Carry out the attacks while remaining undetected for as long as possible to maximize the amount of data collected.
  Undermine the security and trust in e-commerce platforms and potentially exploit the stolen data for subsequent identity theft or social engineering attacks.
