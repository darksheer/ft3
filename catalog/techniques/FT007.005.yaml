tactics: Resource Development
detection: |-
  Implementing strong, complex password policies and multi-factor authentication for VPS management.

  Regularly scanning and updating the VPS infrastructure to patch against known vulnerabilities.
  Employing network monitoring solutions that can detect and flag unusual behavior indicative of a compromised VPS.

  Encouraging customers to report phishing or fraudulent activities hosted on VPS managed by financial institutions.
  Blacklisting and taking down malicious domains quickly that are identified as being used for financial fraud.

  Use by Fraud Detection and Analysis Teams: Fraud detection teams should actively monitor for patterns of traffic or activity originating from VPS services that could be indicative of financial cyber fraud. This includes trends in transaction locations that do not match the user's known profile, volumes of requests that exceed typical patterns, or connections to known bad IPs or domains. Continuous threat intelligence gathering is essential to stay updated on new TTPs (tactics, techniques, and procedures) being used to exploit VPS servers. Additionally, close cooperation with VPS providers can aid in the fast shutdown of services being used for fraudulent purposes.
