id: FT007.005
stix_id: ''
name: 'Acquire Access: VPS'
description: |-
  Adversaries may seek to acquire control over Virtual Private Servers (VPS) as they provide an anonymized platform to conduct illicit activities. Given their scalability, reliability, and remote access, VPSs are attractive to attackers for hosting malware command and control (C2) servers, phishing websites, or as pivot points for further attacks against financial targets.

  Execution: Attackers might exploit weak VPS credentials, leverage stolen credit card details to purchase VPS services illicitly, or utilize vulnerabilities in VPS management software to gain unauthorized access. Once control is established, attackers can use these servers to launch various attacks on financial systems, including but not limited to DDoS attacks, data exfiltration, or hosting malicious sites to capture user credentials.

  Examples:

  - Conducting brute force or dictionary attacks to guess weak passwords used for VPS management consoles.
  - Purchasing VPS services using stolen financial details and using the service to facilitate fraudulent activity.
  - Scanning for and exploiting vulnerabilities in the infrastructure software that manages the VPS, such as hypervisors or control panels.

  Goals: The primary objective for adversaries in acquiring access to a VPS in the context of financial fraud is to facilitate anonymity while conducting attacks, thus avoiding detection and maintaining persistence in their fraudulent activities. VPSs can be used to mask the attacker's location and IP details, host phishing pages, store stolen data, run botnets, or masquerade as legitimate entities in financial transactions.
