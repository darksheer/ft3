name: 'Compromise Accounts: Cloud Accounts'
description: "Compromising cloud accounts is a key technique in financial cyber fraud that involves breaching the accounts held with cloud service providers. Due to the significant amount of sensitive data and critical operations running in the cloud, these accounts are high-value targets for malicious actors. Compromised cloud accounts can provide access to a wealth of confidential financial information, customer data, and other proprietary business resources.\n\nExecution: \n\nFraudsters may employ several methods to compromise cloud accounts, including credential phishing, brute force attacks, exploiting vulnerabilities in cloud platforms, intercepting one-time passwords, or utilizing information obtained from previous data breaches. In addition to these classic approaches, fraudsters can also social engineer their way into gaining account access by manipulating customer service representatives.\n\nFraudulent Resource Procurement Use Case: \n\nAdditionally, adversaries may use fraudulent\
  \ financials to acquire access to cloud-based software and services. This includes using stolen credit card information or banking details to set up accounts that can then be used to facilitate fraudulent activities, or even purchasing access to already compromised cloud accounts from the dark web.\n\nExamples:\n\nPhishing emails targeting employees with cloud provider access to steal login credentials.\nUsing stolen credit card data to purchase and access cloud services anonymously.\nDeploying malware to capture keystrokes and steal credentials directly from the users' devices.\nUtilizing leaked databases to perform credential stuffing across multiple cloud service providers.\n\nGoals: \n\nBy compromising cloud accounts, malicious actors aim to:\n\nGain access to data repositories that may contain financial information, personal customer details, or proprietary business intelligence.\nHarness the computing power of cloud infrastructures to conduct large-scale fraudulent operations, such\
  \ as click fraud or crypto mining.\nDeploy additional malicious services within the victim's cloud environment to facilitate further exploitation or data theft.\nUse the cloud resources to remain anonymous while conducting attacks or financial transactions that are part of broader fraud campaigns."
