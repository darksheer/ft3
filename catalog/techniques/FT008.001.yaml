tactics: Resource Development
detection: "Employing multi-factor authentication and strong password policies to guard against unauthorized access.\n\nRegular security audits and compliance checks within cloud environments to detect misconfigurations or unsecured resources.\n\nImplementing user behavior analytics to detect anomalous login patterns or unusual activity within cloud services.\n\nRestricting privileges to the principle of least privilege, ensuring that access rights are commensurate with job requirements.\n\nProviding ongoing security awareness training to employees to help identify and avoid phishing attempts and other forms of social engineering.\n\nUse by Fraud Detection and Analysis Teams: \n\nFraud detection teams should be equipped with tools that enable real-time monitoring and analysis of cloud account usage. They should look out for signs of compromise, such as sudden spikes in resource usage, unexpected location access, or the creation of new, unauthorized user accounts. Teams can also utilize threat\
  \ intelligence platforms to stay informed of the latest TTPs (tactics, techniques, and procedures) used by attackers to compromise cloud accounts. Rapid incident response policies should be in place to address any potential account breaches, including the isolation of affected accounts, resetting of credentials, and forensic analysis to determine the extent of the compromise."
