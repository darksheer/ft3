tactics: Resource Development
detection: "Instituting multi-factor authentication to mitigate the risk of credential compromise.\n\nDeploying advanced email security solutions with capabilities to detect and block phishing attempts and malicious attachments.\n\nRegular account and system audits to ensure access controls are appropriate, and software is up-to-date with the latest security patches.\n\nImplementing user and entity behavior analytics (UEBA) to detect anomalous access patterns or unusual email activities that may indicate compromise.\n\nConducting continuous employee training on security best practices and the identification of social engineering tactics.\n\nUse by Fraud Detection and Analysis Teams: \n\nFraud detection teams should actively monitor for signs of email account compromise, such as changes in account settings, unauthorized logins, or unusual patterns of email being sent or forwarded. Suspicious activities can be flagged for immediate investigation, potentially halting ongoing fraud attempts.\
  \ In cases where financial fraud is used to procure email account access, teams should coordinate with financial institutions to track the origin of the transactions and identify associated fraudulent activities. If compromise is established, immediate steps to secure the accounts should be taken, such as password changes, revocation of session tokens, and a review of recent activities for any signs of fraud or data breaches."
