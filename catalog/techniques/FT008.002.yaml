name: 'Compromise Accounts: Email Accounts'
description: "Compromising email accounts is a fundamental tactic in financial cyber fraud, where malicious actors seek unauthorized access to personal or corporate email accounts. Email accounts are gateways to a plethora of sensitive information and serve as a linchpin in identity verification processes. Compromised accounts can be exploited for initiating fraudulent financial transactions, executing business email compromise (BEC) scams, gaining further access to other systems via password resets, and harvesting sensitive data.\n\nExecution: \n\nAttackers may compromise email accounts using a variety of methods, including phishing or spear-phishing campaigns to deceive users into divulging their credentials, exploiting security vulnerabilities in email systems, deploying keyloggers or other malware to capture passwords, and leveraging information from previous data breaches to try commonly reused credentials.\n\nFraudulent Resource Procurement Use Case: \n\nFraudsters might also use stolen\
  \ or counterfeit financial resources to purchase or bribe for access to compromised email accounts. These purchased accounts can then facilitate the orchestration of coordinated fraud campaigns, enhance the impersonation of legitimate entities, or serve as a means to distribute malicious content and links.\n\nExamples:\n\nSending phishing emails with malicious attachments or links that lead to fake login pages designed to steal credentials.\nPurchasing access to hacked email accounts on the dark web, which have been compromised through various means.\nInstalling malware on victims' devices to record keystrokes and steal login information as users access their email accounts.\nExploiting flaws in email server software to gain unauthorized access to users' email accounts.\n\nGoals: \n\nThe goals of adversaries in compromising email accounts include:\n\nAccessing and exfiltrating sensitive financial data and personal information stored in emails.\nUsing compromised accounts to perpetrate\
  \ BEC scams, encouraging victims to wire funds to criminal-controlled bank accounts.\nManipulating email correspondence to redirect financial correspondence or transactions towards attacker-controlled accounts.\nEstablishing a foothold for further attacks against the compromised individual's personal or professional network."
