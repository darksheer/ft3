tactics: Resource Development
detection: "Implement network monitoring and intrusion detection systems to spot unauthorized access attempts.\n\nEducate users and administrators about the importance of securing access credentials and recognizing phishing attempts.\n\nAdopt strong, multi-factor authentication measures to protect against compromised credentials.\n\nRegularly audit and update systems, applications, and network configurations to close potential security gaps.\n\nUse by Fraud Detection and Analysis Teams: \nTeams dedicated to detecting fraud must continuously search for signs of the 'Acquire Access' technique across all systems, utilizing various tools that flag anomalies, unauthorized changes, and intrusion attempts. Upon detecting unauthorized access, rapid response protocols are enacted, and investigation procedures are initiated to track down perpetrators and understand the breadth of their access. Post-incident actions are taken to reinforce the compromised systems, educate users affected, and improve\
  \ overall security posture to prevent similar incidents."
