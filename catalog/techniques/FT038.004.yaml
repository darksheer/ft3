tactics: Collection & Exfiltration
detection: "Implementing alerts within the Stripe dashboard to notify account owners of executed Sigma queries and file exports, particularly those that are large or outside normal business hours.\n\nLimiting the access privileges to Sigma's functionality based on roles, ensuring only those with a direct need can generate and download reports.\n\nUtilizing audit logs and analysis tools to monitor and review access patterns to sensitive financial reporting features within the Stripe dashboard.\n\nEducating users about the secure use of Sigma reports and the proper handling of downloaded financial data.\n\nEnabling two-factor authentication and requiring IP whitelisting for accessing detailed financial reports.\n\nUse by Fraud Detection and Analysis Teams: \n\nFraud detection teams must proactively monitor the use of Sigma reports within the Stripe dashboard, analyzing logs for abnormal query patterns, enumerating data access, and detecting unauthorized exports. Automated monitoring tools\
  \ and anomaly detection algorithms should be in place to identify and alert on suspicious activities. Upon detecting unexpected data exfiltration, immediate revocation of access, analysis of the extent of the compromise, and taking legal actions where necessary are crucial. Post-incident, there should be a thorough investigation to identify the source of the breach, reinforce secure data handling practices, and ensure stricter access controls on the reporting tools."
