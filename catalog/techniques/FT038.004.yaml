name: 'Data Exfiltration: Sigma Reports'
description: "Sigma reports in the Stripe dashboard are a powerful tool that users can utilize to query and analyze their Stripe data. Data exfiltration involving Sigma reports refers to the unauthorized extraction of sensitive information from the Stripe dashboard by exploiting this reporting functionality. An attacker with access to a user's Stripe account may create and execute custom Sigma queries to gather and stealthily export large volumes of transactional data, customer personal details, or financial reports.\n\nExecution: \n\nTo carry out this type of exfiltration, a malicious actor either compromises existing Stripe account credentials or fraudulently gains access by exploiting other vulnerabilities such as phishing, social engineering, or weak authentication practices. Once inside the dashboard, they leverage the Sigma feature to run queries that pull out detailed financial data. This information is then exported, often in a common file format (.csv, .json, etc.), and transmitted\
  \ to a destination outside the control of the legitimate account owners.\n\nExamples:\n\nAn attacker with unauthorized access to a Stripe account uses Sigma's SQL query editor to generate a comprehensive report that includes all transactions, refunds, and customer billing information, then downloads this file for malicious use.\nA fraudster uses Sigma reports to retrieve a list of email addresses and payment details that could be used for targeted phishing campaigns or identity theft.\nA malicious insider with access to Sigma intentionally exfiltrates competitive business insights like sales trends, popular products, or consumer behavior data to sell to competitors or use in starting a rival business.\n\nGoals: The goals behind exfiltrating data using Sigma reports in Stripe accounts include:\n\nAcquiring financial and personal data that can be used for financial fraud, such as credit card fraud or selling the information on the dark web.\nGaining insights into company operations, customer\
  \ base, and finances for competitive advantage or malicious intent.\nUsing the aggregated data for additional targeted attacks against the business itself or its customers."
