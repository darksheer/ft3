name: 'Compromise Accounts: Social Media Accounts'
description: "Compromising social media accounts is an increasingly prevalent technique in financial cyber fraud, where attackers aim to gain control of profiles on platforms like Facebook, Twitter, LinkedIn, and Instagram. Social media accounts often carry inherent trust with followers and can be leveraged to perform a variety of malicious activities, from spreading misinformation to phishing and spear-phishing campaigns, all of which can have financial motives and repercussions.\n\nExecution: \n\nTo compromise these accounts, fraudsters might use phishing attacks targeting the account owners, employ credential stuffing with previously leaked login details, exploit platform-specific vulnerabilities, or take over the accounts through social engineering techniques aimed at the platform's customer support.\n\nFraudulent Resource Procurement Use Case: \n\nAdditionally, attackers might use illicitly obtained financial resources to buy access to already compromised accounts, especially those\
  \ with a significant follower base or verified status. These purchased accounts are then used as a launchpad for financial fraud schemes, to sell fake \"influence\" services, or to promote scams under the guise of a trusted identity.\n\nExamples:\n\nPhishing messages via social media DMs (Direct Messages) or emails linked to fraudulent login pages designed to harvest social media account credentials.\nAutomated bots running credential stuffing attacks across various social media platforms to exploit reused passwords.\nManipulating social media platform recovery processes to gain unauthorized control over an account.\nBuying and selling access to hacked social media accounts on the dark web to conduct fraudulent activities.\n\nGoals: Adversaries focus on social media accounts for several reasons:\n\nTo use the compromised account identity and follower trust to promote fraudulent financial schemes, such as fake investment opportunities or counterfeit products.\nInitiate direct financial\
  \ fraud via fraudulent fundraisers or payment request scams.\nExploit the compromised account as a stepping stone for further social engineering or phishing attacks on connected individuals or businesses.\nDisseminate malware links that, when clicked, could compromise further accounts or lead to financial data theft."
