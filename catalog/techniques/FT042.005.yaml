id: FT042.005
stix_id: ''
name: 'Account Manipulation: Additional Bank Accounts'
description: "Within the Stripe payment platform, account manipulation involving the addition of additional bank accounts constitutes unauthorized alterations to a Stripe account's financial payout arrangements. Malicious actors add new bank account details to the Stripe account settings with the aim of redirecting future payouts and transferring funds to accounts they control.\n\nExecution: \n\nA cybercriminal who has gained access to a Stripe account—whether through phishing, account takeover, or exploiting system vulnerabilities—navigates to the payout settings. Here, they can insert information for an additional bank account, often one set up under false pretenses or controlled by the attacker. After verifying or satisfying Stripe's account validation procedures, the fraudster can then adjust payout schedules or initiate immediate transfers to the new account.\n\nExamples:\n\nAn attacker modifies the linked bank account in a compromised Stripe account to divert incoming payments from\
  \ sales or other service transactions.\nConfiguring an altered automatic transfer schedule under the guise of a \"new business account\" that channels funds away from the legitimate business.\nManipulating payout settings following a high-revenue event, such as a flash sale or product launch, to siphon off a substantial volume of payments.\n\nGoals: The objectives behind the tactic of adding unauthorized additional bank accounts to a compromised Stripe account include:\n\nRerouting funds from legitimate financial transactions, such as customer payments, to accounts under the attacker's control.\nConducting extensive financial fraud through deceptive payouts or cash-outs before the original account holder detects the unauthorized changes.\nHiding the trail of illicit financial gains, often as part of broader money laundering operations, by using legitimate payment processing services like Stripe to give an appearance of legitimate business activity."
