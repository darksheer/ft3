tactics: Collection & Exfiltration
detection: "Implementing strong access controls and multi-factor authentication to minimize the risk of unauthorized access to Stripe accounts.\n\nRegularly auditing and monitoring for unusual access patterns or data export activities within Stripe, such as unexpected report downloads or API calls related to payouts.\n\nRestricting the ability to export sensitive payout-related data through user role management within Stripe's interface.\n\nTraining employees to recognize the signs of account compromise and to report suspected incidents immediately.\n\nUse by Fraud Detection and Analysis Teams: \n\nFraud detection teams bearing the responsibility for safeguarding Stripe accounts must maintain vigilant monitoring of account activity, focusing on payouts and associated data movements. Advanced data analysis tools can be employed to detect anomalies such as abnormal export patterns or the setup of unusual payout schedules. When indicators of exfiltration activities are found, swift investigative\
  \ and remedial actions, including temporary freezes on payouts and revoking suspicious API tokens, are essential. Post-detection, an assessment of the breach and the implementation of additional security measures can help mitigate the risk of future incidents while ensuring the protection of sensitive financial information."
