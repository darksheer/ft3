id: FT007.007
stix_id: ''
name: 'Acquire Access: Virtual Private Server'
description: |-
  Adversaries may acquire access to Virtual Private Servers (VPS) to establish a platform from which to conduct financial fraud activities discreetly and effectively. A VPS offers the benefits of a dedicated server with the added flexibility and privacy that adversaries require to mount sophisticated and hard-to-trace attacks on financial systems or to obfuscate their fraudulent transactions.

  Execution: Attackers may gain access to VPSs by renting them using stolen financial information or by compromising them through vulnerabilities. Once under their control, these digital strongholds can be used to facilitate a variety of fraudulent endeavors, ranging from hosting phishing websites to serving as a relay for laundering stolen funds.

  Examples:

  Purchasing VPS services with stolen credit card details to mask the true identity and location of the fraudster.
  Gaining unauthorized access to VPS accounts by exploiting insecure management interfaces or weak authentication practices.
  Brute-forcing or using leaked credentials to hijack existing VPS accounts, which are then used for clandestine activities.
  Goals: Adversaries leverage VPS access to:

  Mask their online identities, ensuring that fraudulent activities cannot be easily traced back to their real IP addresses.
  Set up and operate command and control centers for malware campaigns without being detected by law enforcement or cybersecurity teams.
  Host fake banking sites, payment portals, or financial services to scam users out of their credentials and funds.
