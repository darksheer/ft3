tactics: Discovery & Profiling
detection: "Setting up alerting systems for unusual account activity, such as accessing unfamiliar sections of the Stripe dashboard, modifying account configurations, or making abnormal API requests.\n\nImplementing strict role-based access controls (RBAC) to limit the capabilities that any compromised user or role can exploit.\n\nRegularly reviewing and restricting API tokens and credentials to the least amount of privilege necessary to execute expected business functions.\n\nEmploying behavioral analytics to detect patterns of activity within the account that deviate from the norm, which could indicate internal enumeration.\n\nRegularly auditing accounts for any signs of compromise and integrating fraud detection systems capable of identifying subtle indicators of enumeration.\n\nUse by Fraud Detection and Analysis Teams: \n\nFraud detection teams should have mechanisms to monitor Stripe accounts in real-time for signals of enumeration and atypical use patterns. This involves detailed\
  \ logging of user activities, including which parts of the Stripe dashboard or which API endpoints are being accessed and from what IP addresses. Following detection, the prompt revocation of suspicious sessions and a thorough security review are vital steps. It's also crucial to inform and guide the legitimate account holders through the process of regaining control, reinforcing security measures, and assessing the extent of any data exposure or financial impact from the enumeration activity."
