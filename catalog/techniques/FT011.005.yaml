id: FT011.005
stix_id: ''
name: 'Account Takeover: Fake ID'
description: |
  Attackers may submit fake identification documents to an identity verification system, such as those used by various financial platforms, to bypass security measures and gain control over victim accounts. This tactic allows unauthorized access to sensitive account information and resources.; Execution: Attackers create or obtain fraudulent identification documents and submit them as part of the identity verification process. This can involve using photo-editing software to modify legitimate IDs or generating entirely fake documents. Once the submission is accepted, attackers can gain access to the victim's account and manipulate it as desired.; Examples: Creating a forged driver's license or ID card and submitting it for verification.; Using stolen personal information to produce counterfeit identification.; Exploiting weak verification processes that do not adequately check the authenticity of submitted documents.; Goals: The primary objectives behind submitting fake IDs for identity verification include: Gaining unauthorized access to victim accounts to appropriate funds or sensitive information.; Manipulating account settings to redirect payouts or alter payment configurations.; Carrying out further fraudulent activities under the guise of the legitimate account holder.
