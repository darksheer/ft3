tactics: Collection & Exfiltration
detection: "Utilizing anomaly detection systems to monitor and alert on unexpected data export or transfer activities within Stripe.\n\nImplementing strict role-based access control (RBAC) and multi-factor authentication (MFA) for any data export or pipeline configuration changes.\n\nRegularly auditing and reviewing logs of data transfer activities to ensure they correspond with legitimate business needs and authorized actions.\n\nEstablishing policies and trainings for employees that reinforce security best practices around data transfer operations within Stripe.\n\nUse by Fraud Detection and Analysis Teams: \n\nFraud detection teams are responsible for taking a proactive stance on monitoring Stripe account activities, with particular regard to any data transfer actions. When suspicious or unauthorized data transfers are detected, immediate measures may include shutting down the implicated data transfers, revoking compromised API keys, and conducting a thorough security audit. Continuous\
  \ improvement of security practices should include both technical measures to protect against unauthorized access and business process reviews to control and oversee all data transfers within Stripe. In response to identified incidents, teams must also coordinate with affected stakeholders and potentially legal or law enforcement entities."
