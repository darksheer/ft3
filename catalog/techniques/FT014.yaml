name: Supply Chain Compromise
description: |2
   A supply chain compromise in the context of credential access refers to a strategic cyberattack targeting companies in the payment process chain—such as vendors, service providers, or application developers—that businesses rely on for integration with payment systems. The goal is to infiltrate these third parties to gain access to sensitive credentials, customer payment information, or to manipulate payment transactions indirectly.; Execution: Cybercriminals identify vulnerable points in the supply chain, including less secure partner networks or third-party software interacting with payment accounts. They may introduce malicious code into legitimate software updates, exploit weak security practices, or leverage compromised third-party services to inject malicious payloads. Once a supplier is compromised, attackers gain access to credentials or sensitive information of any business relying on that supplier, including API keys or account login information. Examples: Infiltrating the network of a point-of-sale (POS) software provider to capture API keys used by merchants.; Compromising a third-party plugin that integrates with payment systems, injecting code that intercepts and transmits live credentials as merchants input them.; Launching spear-phishing campaigns against employees at companies offering development tools to gain access to their systems and subsequently to user credentials. Goals: Objectives of supply chain compromise attacks include: Obtaining a wide array of account credentials or API keys for unauthorized transactions or large-scale data exfiltration.; Capitalizing on trust and automated processes between suppliers and businesses to gather sensitive information over time.; Using compromised third-party services as a launch point to infiltrate high-value targets within the same supply chain.
