name: Catalog

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Record tested revision
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_EVENT_SHA: ${{ github.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          commit_header = subprocess.check_output(["git", "cat-file", "-p", "HEAD"], text=True).split("\n\n", 1)[0]
          print(json.dumps({
              "event": os.environ["CI_EVENT"],
              "event_sha": os.environ["CI_EVENT_SHA"],
              "head_sha": os.environ["CI_HEAD_SHA"],
              "base_sha": os.environ["CI_BASE_SHA"],
              "checkout_sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "checkout_parents": [line.split()[1] for line in commit_header.splitlines() if line.startswith("parent ")],
          }, sort_keys=True))
          PY
      - run: python3 -m pip install -r requirements.txt
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m ft3_tools check
